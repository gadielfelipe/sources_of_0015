<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Circular 0015 indicadores</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><circle cx='32' cy='32' r='32' fill='%231a5276'/><path d='M12 44 Q20 20 32 28 Q44 36 52 12' stroke='%2327ae60' stroke-width='4' fill='none' stroke-linecap='round'/><path d='M22 52 Q26 30 32 36 Q38 42 44 24' stroke='%23f0b429' stroke-width='2.5' fill='none' stroke-linecap='round'/></svg>">

  <!-- Tailwind CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

  <style>
    /* ── Global ────────────────────────────────────────────── */
    html { scroll-behavior: smooth; }

    /* ── Hero Landing ──────────────────────────────────────── */
    .hero-section {
      position: relative;
      height: 100vh;
      min-height: 600px;
      background: #030d1a;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Coordinate grid */
    .hero-grid {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(0,180,255,0.07) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,180,255,0.07) 1px, transparent 1px);
      background-size: 60px 60px;
    }

    /* Diagonal accent lines */
    .hero-grid::after {
      content: '';
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(0,180,255,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,180,255,0.03) 1px, transparent 1px);
      background-size: 20px 20px;
    }

    /* Scanning line */
    .hero-scan {
      position: absolute;
      left: 0; right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent 0%, rgba(0,200,255,0.55) 50%, transparent 100%);
      animation: heroScan 7s linear infinite;
      z-index: 1;
    }
    @keyframes heroScan {
      0%   { top: -2%; opacity: 0; }
      4%   { opacity: 1; }
      96%  { opacity: 1; }
      100% { top: 102%; opacity: 0; }
    }

    /* Radial glow center */
    .hero-glow {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 600px; height: 600px;
      background: radial-gradient(ellipse at center, rgba(0,80,180,0.18) 0%, transparent 70%);
      pointer-events: none;
      z-index: 1;
    }

    /* Data dots */
    .hero-dot {
      position: absolute;
      border-radius: 50%;
      background: #00b4ff;
      animation: dotPulse 3.5s ease-in-out infinite;
    }
    @keyframes dotPulse {
      0%, 100% { opacity: 0.25; transform: scale(1); }
      50%       { opacity: 0.7;  transform: scale(1.5); }
    }

    /* Content */
    .hero-content {
      position: relative;
      z-index: 2;
      text-align: center;
      padding: 0 28px;
      max-width: 860px;
      animation: heroFadeIn 1.4s cubic-bezier(0.16,1,0.3,1) forwards;
    }
    @keyframes heroFadeIn {
      from { opacity: 0; transform: translateY(28px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .hero-badge {
      display: inline-block;
      font-family: 'Space Mono', 'Courier New', monospace;
      font-size: 10.5px;
      letter-spacing: 0.22em;
      color: #00b4ff;
      text-transform: uppercase;
      border: 1px solid rgba(0,180,255,0.35);
      padding: 6px 18px;
      border-radius: 2px;
      margin-bottom: 32px;
      background: rgba(0,180,255,0.06);
    }

    .hero-title {
      font-family: 'Space Grotesk', 'Helvetica Neue', Arial, sans-serif;
      font-weight: 300;
      font-size: clamp(22px, 4vw, 48px);
      color: #dce8f5;
      line-height: 1.22;
      letter-spacing: -0.01em;
      margin-bottom: 0;
    }
    .hero-title strong {
      font-weight: 600;
      color: #ffffff;
      display: block;
      font-size: clamp(26px, 4.8vw, 56px);
      letter-spacing: -0.025em;
    }
    .hero-title em {
      font-style: normal;
      color: #a8c8e8;
      font-size: 0.82em;
      font-weight: 300;
    }

    .hero-rule {
      width: 40px;
      height: 1px;
      background: rgba(0,180,255,0.45);
      margin: 30px auto;
    }

    .hero-sub {
      font-family: 'Space Mono', 'Courier New', monospace;
      font-size: 11px;
      letter-spacing: 0.2em;
      color: rgba(140,190,230,0.65);
      text-transform: uppercase;
    }

    /* Corner marks */
    .hero-corner {
      position: absolute;
      width: 20px; height: 20px;
      z-index: 2;
      opacity: 0.4;
    }
    .hero-corner.tl { top: 24px; left: 24px; border-top: 1px solid #00b4ff; border-left: 1px solid #00b4ff; }
    .hero-corner.tr { top: 24px; right: 24px; border-top: 1px solid #00b4ff; border-right: 1px solid #00b4ff; }
    .hero-corner.bl { bottom: 24px; left: 24px; border-bottom: 1px solid #00b4ff; border-left: 1px solid #00b4ff; }
    .hero-corner.br { bottom: 24px; right: 24px; border-bottom: 1px solid #00b4ff; border-right: 1px solid #00b4ff; }

    /* Scroll indicator */
    .hero-scroll {
      position: absolute;
      bottom: 36px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      z-index: 2;
      text-decoration: none;
    }
    .hero-scroll-label {
      font-family: 'Space Mono', monospace;
      font-size: 9px;
      letter-spacing: 0.25em;
      color: rgba(0,180,255,0.5);
      text-transform: uppercase;
    }
    .hero-scroll-line {
      width: 1px;
      height: 36px;
      background: linear-gradient(to bottom, rgba(0,180,255,0.5), transparent);
      animation: scrollLine 1.8s ease-in-out infinite;
    }
    @keyframes scrollLine {
      0%   { transform: scaleY(0); transform-origin: top; opacity: 0; }
      40%  { transform: scaleY(1); transform-origin: top; opacity: 1; }
      100% { transform: scaleY(1); transform-origin: top; opacity: 0; }
    }

    /* ── Dashboard wrapper ─────────────────────────────────── */
    #dashboard { position: relative; }

    .map-div { height: 520px; }
    @media (max-width: 768px) { .map-div { height: 340px; } }

    @keyframes pulse-ring {
      0%   { transform: scale(1);   opacity: 0.9; }
      70%  { transform: scale(2.4); opacity: 0;   }
      100% { transform: scale(2.4); opacity: 0;   }
    }
    .alert-pulse {
      animation: pulse-ring 1.8s ease-out infinite;
      border-radius: 50%;
      border: 2px solid #e03131;
      position: absolute;
      pointer-events: none;
    }
    .sequia-pulse {
      animation: pulse-ring 1.8s ease-out infinite;
      animation-delay: -0.9s;
      border-radius: 50%;
      border: 2.5px solid #7a4419;
      position: absolute;
      pointer-events: none;
    }
    .sequia-alert-pulse {
      animation: pulse-ring 1.8s ease-out infinite;
      animation-delay: -0.45s;
      border-radius: 50%;
      border: 2.5px solid #f0b429;
      position: absolute;
      pointer-events: none;
    }

    .table-scroll { max-height: 260px; overflow-y: auto; }
    .leaflet-popup-content p { margin: 3px 0; }
  </style>
</head>
<body class="bg-[#eaf0fb] min-h-screen">
  <div id="root"></div>

  <!-- CDN scripts — order matters, all synchronous -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
  <script src="https://unpkg.com/react@18.2.0/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.23.5/babel.min.js"></script>

  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo } = React;

    // ─── Constants ────────────────────────────────────────────────────────────

    const CATEGORIA_COLORS = {
      'Sin lluvia (0 mm)':   '#adb5bd',
      'Muy ligera (< 5 mm)': '#74c0fc',
      'Ligera (5\u201315 mm)':    '#339af0',
      'Moderada (15\u201330 mm)': '#f0b429',
      'Fuerte (30\u201360 mm)':   '#e03131',
      'Extrema (\u2265 100 mm)':  '#7b0000',
    };

    const LEGEND_ENTRIES = [
      { label: 'Sin lluvia (0 mm)',    color: '#adb5bd' },
      { label: 'Muy ligera (< 5 mm)',  color: '#74c0fc' },
      { label: 'Ligera (5\u201315 mm)',     color: '#339af0' },
      { label: 'Moderada (15\u201330 mm)',  color: '#f0b429' },
      { label: 'Fuerte (30\u201360 mm)',    color: '#e03131' },
      { label: 'Extrema (\u2265 100 mm)',   color: '#7b0000' },
    ];

    const SEQUIA_COLORS = {
      'NORMAL':   '#adb5bd',
      'LEVE':     '#ffe066',
      'MODERADA': '#f0b429',
      'SEVERA':   '#e8590c',
      'EXTREMA':  '#7b0000',
    };

    const SEQUIA_LEGEND_ENTRIES = [
      { label: 'Normal',   color: '#adb5bd' },
      { label: 'Leve',     color: '#ffe066' },
      { label: 'Moderada', color: '#f0b429' },
      { label: 'Severa',   color: '#e8590c' },
      { label: 'Extrema',  color: '#7b0000' },
    ];

    const AMENAZA_MM_COLORS = {
      'MUY_BAJA': '#218a21',
      'BAJA':     '#90ee90',
      'MEDIA':    '#ffd900',
      'ALTA':     '#ff800d',
      'MUY_ALTA': '#d91919',
      '':         '#adb5bd',
    };
    const DESLIZ_LEGEND_ENTRIES = [
      { label: 'Muy baja',                      color: '#218a21' },
      { label: 'Baja',                          color: '#90ee90' },
      { label: 'Media',                         color: '#ffd900' },
      { label: 'Alta',                          color: '#ff800d' },
      { label: 'Muy alta',                      color: '#d91919' },
    ];

    // ─── Helpers ──────────────────────────────────────────────────────────────

    function precipCategoria(mm) {
      if (mm <= 0)   return 'Sin lluvia (0 mm)';
      if (mm <  5)   return 'Muy ligera (< 5 mm)';
      if (mm < 15)   return 'Ligera (5\u201315 mm)';
      if (mm < 30)   return 'Moderada (15\u201330 mm)';
      if (mm < 60)   return 'Fuerte (30\u201360 mm)';
      return 'Extrema (\u2265 100 mm)';
    }

    function precipTamano(mm) {
      return Math.max(5, Math.min(Math.sqrt(mm + 1) * 2.8 + 4, 22));
    }

    const ALERTA_NIVEL = { 'BAJA': 0, 'MODERADA': 1, 'ALTA': 2, 'CRÍTICA': 3 };

    function parseRows(raw) {
      return raw.map(r => {
        const cod                   = r['COD_MPIO'] ?? r['\uFEFFCOD_MPIO'] ?? '';
        const mm                    = parseFloat(r.precip_acum_mm) || 0;
        const alerta_compuesta_raw  = (r.alerta_compuesta ?? 'BAJA').trim();
        const afectado              = parseInt(r.municipio_afectado) || 0;
        // Alerta efectiva: solo válida si el municipio tiene antecedente histórico de inundación
        const alerta_compuesta      = afectado === 1 ? alerta_compuesta_raw : 'BAJA';
        const alert                 = ALERTA_NIVEL[alerta_compuesta] ?? 0;
        return {
          COD_MPIO:             String(cod),
          NOM_MPIO:             (r.NOM_MPIO         ?? '').trim(),
          NOM_DPTO:             (r.NOM_DPTO         ?? '').trim(),
          LATITUD:              parseFloat(r.LATITUD),
          LONGITUD:             parseFloat(r.LONGITUD),
          precip_acum_mm:       mm,
          precip_max_10min:     parseFloat(r.precip_max_10min)    || 0,
          n_estaciones:         parseInt(r.n_estaciones, 10)      || 0,
          alerta:               alert,
          alerta_compuesta,
          alerta_compuesta_raw,   // nivel histórico original (antes de filtro inundación)
          frecuencia_extremos:  parseFloat(r.frecuencia_extremos) || 0,
          frecuencia_reciente:  parseFloat(r.frecuencia_reciente) || 0,
          ratio_reciente:       parseFloat(r.ratio_reciente)      || 0,
          tendencia:            (r.tendencia         ?? 'sin_datos').trim(),
          fecha:                (r.fecha             ?? '').trim(),
          sequia_categoria:     (r.sequia_categoria   ?? 'NORMAL').trim(),
          categoria:            r.categoria ? r.categoria.trim() : precipCategoria(mm),
          tamano:               parseFloat(r.tama\u00f1o) || precipTamano(mm),
          municipio_afectado:   afectado,
        };
      }).filter(r => !isNaN(r.LATITUD) && !isNaN(r.LONGITUD));
    }

    function computeKpis(data) {
      if (!data.length) return { total: 0, enAlerta: 0, enAlertaSequia: 0, promedio: '0.00', maximo: 0, maxMpio: '' };
      const total          = data.length;
      const enAlerta       = data.filter(d => d.alerta > 0).length;
      const enAlertaSequia = data.filter(d => d.sequia_categoria === 'SEVERA').length;
      const sum            = data.reduce((acc, d) => acc + d.precip_acum_mm, 0);
      const promedio       = (sum / total).toFixed(2);
      const maxRow         = data.reduce((a, b) => b.precip_acum_mm > a.precip_acum_mm ? b : a);
      return { total, enAlerta, enAlertaSequia, promedio, maximo: maxRow.precip_acum_mm, maxMpio: maxRow.NOM_MPIO };
    }

    // ─── CSV Download Helper ──────────────────────────────────────────────────

    function downloadCSV(data, filename) {
      if (!data.length) return;
      const headers = ['COD_MPIO','NOM_MPIO','NOM_DPTO','precip_acum_mm','precip_max_10min',
                       'alerta_compuesta','frecuencia_extremos','frecuencia_reciente',
                       'ratio_reciente','tendencia','sequia_categoria','n_estaciones','fecha'];
      const rows = data.map(r =>
        headers.map(h => {
          const v = r[h] ?? '';
          return typeof v === 'string' && v.includes(',') ? `"${v}"` : v;
        }).join(',')
      );
      const csv = '\uFEFF' + [headers.join(','), ...rows].join('\r\n');
      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const url  = URL.createObjectURL(blob);
      const a    = document.createElement('a');
      a.href = url; a.download = filename; a.click();
      URL.revokeObjectURL(url);
    }

    // ─── Cartera Report Helper ────────────────────────────────────────────────

    function exportReportePDF(result, mergedRows, dataFecha) {
      const fmtCOP = v => v.toLocaleString('es-CO', { style:'currency', currency:'COP', maximumFractionDigits:0 });
      const alertaColor = a =>
        a === 'CRÍTICA' ? '#7b0000' : a === 'ALTA' ? '#e03131' :
        a === 'MODERADA' ? '#b7770d' : a === 'BAJA' ? '#27ae60' : '#999';

      const tableRows = mergedRows.map(r => `
        <tr style="${r.alerta_lluvias === 'ALTA' ? 'background:#fff0f0' : r.alerta_lluvias === 'CRÍTICA' ? 'background:#fdf0f0' : ''}">
          <td>${r.cod}</td><td>${r.nombre}</td>
          <td style="text-align:right">${fmtCOP(r.cartera_total)}</td>
          <td style="text-align:center;color:${alertaColor(r.alerta_lluvias)};font-weight:600">${r.alerta_lluvias}</td>
        </tr>`).join('');

      const html = `<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8">
<title>Reporte Cartera – Alerta Lluvias ALTA</title>
<style>
  body{font-family:Arial,sans-serif;padding:24px;color:#333;font-size:13px}
  h1{color:#1a5276;margin-bottom:4px}
  .meta{color:#888;font-size:12px;margin-bottom:18px}
  .kpi-row{display:flex;gap:16px;margin-bottom:20px;flex-wrap:wrap}
  .kpi{background:#eaf0fb;padding:14px 20px;border-radius:8px;border-left:4px solid #1a5276;min-width:200px}
  .kpi.red{border-color:#e03131}
  .kpi-val{font-size:1.6em;font-weight:700;color:#1a5276}
  .kpi.red .kpi-val{color:#e03131}
  .kpi-lbl{font-size:11px;color:#555;margin-top:2px}
  .indicator-box{background:#1a5276;color:white;border-radius:10px;padding:20px 28px;margin-bottom:20px;display:inline-block}
  .indicator-val{font-size:2.4em;font-weight:700}
  .indicator-lbl{font-size:12px;opacity:0.85;margin-top:4px}
  table{width:100%;border-collapse:collapse;font-size:12px}
  th{background:#1a5276;color:white;padding:8px 10px;text-align:left}
  td{padding:6px 10px;border-bottom:1px solid #eee}
  @media print{body{padding:10px}.no-print{display:none}}
</style></head><body>
<h1>Reporte: Cartera en Municipios con Alerta de Lluvias ALTA</h1>
<div class="meta">Fuente datos climáticos: IDEAM – datos.gov.co &nbsp;|&nbsp;
  Fecha datos: <b>${dataFecha ?? 'N/A'}</b> &nbsp;|&nbsp;
  Generado: <b>${new Date().toLocaleDateString('es-CO',{day:'2-digit',month:'long',year:'numeric'})}</b></div>
<div class="indicator-box">
  <div class="indicator-val">${result.indicator}%</div>
  <div class="indicator-lbl">Cartera en alerta ALTA / Cartera total</div>
</div>
<div class="kpi-row">
  <div class="kpi red">
    <div class="kpi-val">${fmtCOP(result.cartaAlta)}</div>
    <div class="kpi-lbl">Cartera en municipios con alerta ALTA</div>
  </div>
  <div class="kpi">
    <div class="kpi-val">${fmtCOP(result.totalCartera)}</div>
    <div class="kpi-lbl">Cartera total</div>
  </div>
  <div class="kpi">
    <div class="kpi-val">${result.nAlta} / ${result.nTotal}</div>
    <div class="kpi-lbl">Municipios en alerta ALTA / Total en cartera</div>
  </div>
</div>
<h2 style="color:#1a5276;margin-bottom:8px">Detalle por municipio</h2>
<table><thead><tr>
  <th>Código</th><th>Municipio</th><th style="text-align:right">Cartera total</th><th style="text-align:center">Alerta lluvias</th>
</tr></thead><tbody>${tableRows}</tbody></table>
</body></html>`;

      const w = window.open('', '_blank');
      w.document.write(html);
      w.document.close();
      setTimeout(() => w.print(), 400);
    }

    const ALERTA_BADGE = {
      'CRÍTICA': '<span style="color:#7b0000;font-weight:700;">\u26a0 CRÍTICA</span>',
      'ALTA':    '<span style="color:#e03131;font-weight:600;">\u26a0 ALTA</span>',
      'MODERADA':'<span style="color:#f0b429;font-weight:600;">\u26a0 MODERADA</span>',
      'BAJA':    '<span style="color:#27ae60;">\u2713 BAJA</span>',
    };

    const TENDENCIA_LABEL = {
      'creciente':    '\u2197 Creciente',
      'decreciente':  '\u2198 Decreciente',
      'estable':      '\u2192 Estable',
      'insuficiente': '\u2014 Insuficiente',
      'sin_datos':    '\u2014 Sin datos',
    };

    function buildPopup(m) {
      const badge     = ALERTA_BADGE[m.alerta_compuesta] ?? ALERTA_BADGE['BAJA'];
      const tendLabel = TENDENCIA_LABEL[m.tendencia]     ?? m.tendencia;
      const fechaLabel = m.fecha
        ? `<p style="margin-top:6px;color:#888;font-size:11px;">Datos al: <b>${m.fecha}</b></p>`
        : '';

      // Señal sobre el día actual
      const extremeToday = m.precip_acum_mm >= 30
        ? `<p style="color:#e03131;font-weight:600;margin-top:3px;">\u26a0 Probable evento extremo reciente</p>`
        : (m.precip_acum_mm === 0 && m.sequia_categoria !== 'NORMAL')
        ? `<p style="color:#b7770d;font-weight:600;margin-top:3px;">\u2600\ufe0f Sin lluvia \u2014 posible sequ\u00eda activa</p>`
        : '';

      // Sección sequía solo si hay alerta real
      const sequiaSection = m.sequia_categoria && m.sequia_categoria !== 'NORMAL' ? `
          <hr style="margin:6px 0;border-color:#eee;">
          <p style="font-size:12px;font-weight:600;color:#b7770d;margin-bottom:2px;">\uD83C\uDF35 Sequ\u00eda recurrente</p>
          <p><b>Categor\u00eda:</b> <span style="color:#b7770d;font-weight:600;">${m.sequia_categoria}</span></p>` : '';

      // Sección inundaciones históricas — aparece para TODOS los municipios afectados
      const tieneAlertaEfectiva = m.alerta_compuesta === 'ALTA' || m.alerta_compuesta === 'CRÍTICA';
      const floodSection = m.municipio_afectado === 1
        ? tieneAlertaEfectiva
          ? `<hr style="margin:6px 0;border-color:#eee;">
             <p style="font-size:12px;font-weight:700;color:#1a5276;margin-bottom:2px;">\uD83C\uDF0A Municipio hist\u00f3ricamente afectado por inundaciones</p>
             <p style="font-size:11px;color:#e03131;font-weight:600;">\u26a0 Alto riesgo: alerta activa + antecedente de inundaci\u00f3n</p>`
          : `<hr style="margin:6px 0;border-color:#eee;">
             <p style="font-size:12px;font-weight:600;color:#1a5276;margin-bottom:2px;">\uD83C\uDF0A Municipio hist\u00f3ricamente afectado por inundaciones</p>`
        : '';

      return `
        <div style="font-family:Arial,sans-serif;font-size:13px;min-width:220px;">
          <div style="color:#1a5276;font-size:14px;font-weight:700;margin-bottom:2px;">${m.NOM_MPIO}</div>
          <div style="color:#666;font-size:12px;margin-bottom:6px;">${m.NOM_DPTO}</div>
          <hr style="margin:4px 0;border-color:#eee;">
          <p style="font-size:12px;font-weight:600;color:#1a5276;margin-bottom:2px;">\uD83C\uDF27\uFE0F Precipitaci\u00f3n hoy</p>

    // ─── KPI Cards ────────────────────────────────────────────────────────────

    function KpiCard({ label, value, sub, icon, accent }) {
      const border = accent === 'red'   ? 'border-[#e03131]'
                   : accent === 'gold'  ? 'border-[#f0b429]'
                   : accent === 'green' ? 'border-[#27ae60]'

    function KpiCards({ kpis, activeMap, amenazasData }) {
      const alertaValue = activeMap === 'sequias'       ? kpis.enAlertaSequia

          <KpiCard label="M&aacute;x. precipitaci&oacute;n" value={`${kpis.maximo} mm`}   icon="&#x1F4CD;" accent="gold" sub={kpis.maxMpio} />

    // ─── Deslizamientos Map Panel ─────────────────────────────────────────────

    function DeslizMapPanel({ amenazasData, visible = true }) {
      const mapDiv      = useRef(null);
      const leafletMap  = useRef(null);
      const layerGroup  = useRef(null);
      const initialized = useRef(false);

      useEffect(() => {
        if (initialized.current) return;
        initialized.current = true;
        const map = L.map(mapDiv.current, { center: [4.5, -74.0], zoom: 5 });
        L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
          attribution: '&copy; OpenStreetMap contributors &copy; CARTO', maxZoom: 19,
        }).addTo(map);
        map.fitBounds([[1, -79], [13, -67]]);
        layerGroup.current = L.layerGroup().addTo(map);
        leafletMap.current = map;
      }, []);

      useEffect(() => {
        if (visible && leafletMap.current) setTimeout(() => leafletMap.current.invalidateSize(), 50);
      }, [visible]);

      useEffect(() => {
        if (!layerGroup.current) return;
        layerGroup.current.clearLayers();
        const entries = Object.values(amenazasData).filter(d => !isNaN(d.lat) && !isNaN(d.lon));

        entries.forEach(d => {
          const color      = AMENAZA_MM_COLORS[d.amenaza_mm] ?? '#adb5bd';
          const hasAlerta  = d.alerta_deslizamiento === 'ALTA';
          const radius     = hasAlerta ? 9 : 6;
          const weight     = hasAlerta ? 2.5 : 0.8;
          const fillOpac   = hasAlerta ? 0.92 : 0.65;
          const borderCol  = hasAlerta ? '#7b0000' : '#fff';

          const marker = L.circleMarker([d.lat, d.lon], {
            radius, color: borderCol, weight, fillColor: color, fillOpacity: fillOpac,
          });

          // Pulse ring for active IDEAM alert
          if (hasAlerta) {
            const iconHtml = `<div class="alert-pulse" style="width:22px;height:22px;margin-top:-11px;margin-left:-11px;border-color:#d91919;"></div>`;
            L.marker([d.lat, d.lon], { icon: L.divIcon({ html: iconHtml, className: '', iconSize: [0,0] }) }).addTo(layerGroup.current);
          }

          const acum3  = d.acum_3dias_mm  != null ? `${d.acum_3dias_mm.toFixed(1)} mm` : 'N/D';
          const acum10 = d.acum_10dias_mm != null ? `${d.acum_10dias_mm.toFixed(1)} mm` : 'N/D';
          const dias   = d.dias_lluvia    != null ? d.dias_lluvia : 'N/D';
          const amenazaLabel = { 'MUY_BAJA':'Muy baja','BAJA':'Baja','MEDIA':'Media','ALTA':'Alta','MUY_ALTA':'Muy alta' }[d.amenaza_mm] ?? d.amenaza_mm;
          const alertaBadge  = hasAlerta
            ? `<span style="color:#d91919;font-weight:700;">\u26a0 ALTA \u2014 Alerta IDEAM</span>`
            : `<span style="color:#27ae60;">\u2713 Sin alerta activa</span>`;

          const fechaLine = d.fecha_ideam
            ? `<p style="color:#888;font-size:11px;margin-top:4px;">Alerta al: <b>${d.fecha_ideam}</b></p>` : '';

          const acumSection = hasAlerta ? `
            <hr style="margin:6px 0;border-color:#eee;">
            <p style="font-size:12px;font-weight:600;color:#7b3f00;margin-bottom:2px;">\uD83C\uDF27 Precipitaci\u00f3n acumulada</p>
            <p><b>\u00daltimos 3 d\u00edas:</b> ${acum3}</p>
            <p><b>\u00daltimos 10 d\u00edas:</b> ${acum10}</p>
            <p><b>D\u00edas con lluvia:</b> ${dias}</p>` : '';

          const popup = `
            <div style="font-family:Arial,sans-serif;font-size:13px;min-width:210px;">
              <div style="color:#1a5276;font-size:14px;font-weight:700;margin-bottom:2px;">${d.nom_mpio}</div>
              <div style="color:#666;font-size:12px;margin-bottom:6px;">${d.nom_dpto}</div>
              <hr style="margin:4px 0;border-color:#eee;">
              <p style="font-size:12px;font-weight:600;color:#7b3f00;margin-bottom:2px;">\u26f0 Amenaza MM \u2014 SGC 1:500k</p>
              <p><b>Nivel est\u00e1tico:</b> <span style="color:${color};font-weight:600;">${amenazaLabel}</span></p>
              <hr style="margin:6px 0;border-color:#eee;">
              <p style="font-size:12px;font-weight:600;color:#444;margin-bottom:2px;">\uD83D\uDCE1 Alerta diaria IDEAM</p>
              <p>${alertaBadge}</p>
              ${acumSection}
              ${fechaLine}
            </div>`;

          marker.bindPopup(popup, { maxWidth: 240 });
          marker.addTo(layerGroup.current);
        });
      }, [amenazasData]);

      return (
        <div className="relative rounded-xl overflow-hidden shadow">
          <div ref={mapDiv} className="map-div" />
          <Legend mode="deslizamientos" />
        </div>
      );
    }

    // ─── Map Panel ────────────────────────────────────────────────────────────

    function MapPanel({ data, mode = 'lluvias', visible = true }) {
      const mapDiv      = useRef(null);
      const leafletMap  = useRef(null);
      const layerGroup  = useRef(null);
      const initialized = useRef(false);

      // Initialize map once
      useEffect(() => {
        if (initialized.current) return;
        initialized.current = true;

        const map = L.map(mapDiv.current, { center: [4.5, -74.0], zoom: 5 });
        L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
          attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/">CARTO</a>',
          maxZoom: 19,
        }).addTo(map);
        map.fitBounds([[1, -79], [13, -67]]);
        layerGroup.current = L.layerGroup().addTo(map);
        leafletMap.current = map;
      }, []);

      // Invalidate size when tab becomes visible
      useEffect(() => {
        if (visible && leafletMap.current) {
          setTimeout(() => leafletMap.current.invalidateSize(), 50);
        }
      }, [visible]);

      // Rebuild markers on filtered data change or mode change
      useEffect(() => {
        if (!layerGroup.current) return;
        layerGroup.current.clearLayers();

        if (mode === 'sequias') {
          data.forEach(m => {
            const cat    = m.sequia_categoria ?? 'NORMAL';
            const color  = SEQUIA_COLORS[cat] ?? '#adb5bd';
            const radius = 6;

            // Pulsing ring amarillo solo para SEVERA
            if (cat === 'SEVERA') {
              const r2   = radius + 5;
              const size = r2 * 2;
              const pulseIcon = L.divIcon({
                className: '',
                html: `<div class="sequia-alert-pulse" style="width:${size}px;height:${size}px;margin-left:-${r2}px;margin-top:-${r2}px;"></div>`,
                iconSize: [0, 0],
                iconAnchor: [0, 0],
              });
              L.marker([m.LATITUD, m.LONGITUD], { icon: pulseIcon, interactive: false, zIndexOffset: -100 })
                .addTo(layerGroup.current);
            }

            L.circleMarker([m.LATITUD, m.LONGITUD], {
              radius,
              fillColor:   color,
              color:       cat === 'SEVERA' ? '#f0b429' : '#ffffff',
              weight:      cat === 'SEVERA' ? 2.0 : 0.8,
              opacity:     1,
              fillOpacity: 0.85,
            })
            .bindPopup(buildPopup(m), { maxWidth: 240 })
            .addTo(layerGroup.current);
          });
          return;
        }

        // mode === 'lluvias'
        data.forEach(m => {
          const color  = CATEGORIA_COLORS[m.categoria] ?? '#adb5bd';
          const radius = Math.max(5, Math.min(m.tamano, 22));

          // Pulsing ring rojo para ALTA (2) y CRÍTICA (3)
          if (m.alerta >= 2) {
            const size = radius * 2;
            const pulseIcon = L.divIcon({
              className: '',
              html: `<div class="alert-pulse" style="width:${size}px;height:${size}px;margin-left:-${radius}px;margin-top:-${radius}px;"></div>`,
              iconSize: [0, 0],
              iconAnchor: [0, 0],
            });
            L.marker([m.LATITUD, m.LONGITUD], { icon: pulseIcon, interactive: false, zIndexOffset: -100 })
              .addTo(layerGroup.current);
          }

          const borderColor = m.alerta >= 2 ? '#e03131'
                            : m.alerta === 1 ? '#f0b429'
                            : '#ffffff';
          const borderWeight = m.alerta >= 1 ? 2.0 : 0.8;

          L.circleMarker([m.LATITUD, m.LONGITUD], {
            radius,
            fillColor:   color,
            color:       borderColor,
            weight:      borderWeight,
            opacity:     1,
            fillOpacity: 0.82,
          })
          .bindPopup(buildPopup(m), { maxWidth: 240 })
          .addTo(layerGroup.current);
        });
      }, [data, mode]);

      return (
        <div className="bg-white rounded-xl shadow-md overflow-hidden relative">
          <div ref={mapDiv} className="map-div" />
          <Legend mode={mode} />
        </div>
      );
    }

    // ─── Side Panel ───────────────────────────────────────────────────────────

    function FilterBox({ departments, deptFilter, alertOnly, onDeptChange, onAlertToggle, allData, dataFecha }) {
      return (
        <div className="bg-white rounded-xl shadow-md p-4">
          <div className="flex items-center justify-between mb-3">
            <h2 className="text-[#1a5276] font-semibold text-sm">Filtros</h2>
            <button
              onClick={() => downloadCSV(allData, `datos_municipios_${dataFecha ?? 'export'}.csv`)}

          <select
            value={deptFilter}
            onChange={e => onDeptChange(e.target.value)}
            className="w-full border border-gray-300 rounded-md px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-[#1a5276]"
          >
            <option value="ALL">Todos los departamentos</option>
            {departments.filter(d => d !== 'ALL').map(d => (
              <option key={d} value={d}>{d}</option>
            ))}

          <label className="flex items-center gap-2 mt-3 cursor-pointer select-none">
            <input
              type="checkbox"
              checked={alertOnly}

            />

          </label>
        </div>
      );
    }

    function StatsBox({ filteredCount, total }) {
      return (
        <div className="bg-white rounded-xl shadow-md px-4 py-3 text-sm flex items-center gap-2">
          <span className="font-bold text-[#1a5276] text-base">{filteredCount}</span>
          <span className="text-gray-500">/ {total} municipios mostrados</span>
        </div>
      );
    }

    function ChartBox({ allData }) {
      const canvasRef = useRef(null);
      const chartRef  = useRef(null);

      useEffect(() => {
        if (!canvasRef.current) return;

        const deptMap = {};
        allData.forEach(d => {
          if (!deptMap[d.NOM_DPTO]) deptMap[d.NOM_DPTO] = { sum: 0, count: 0 };
          deptMap[d.NOM_DPTO].sum   += d.precip_acum_mm;
          deptMap[d.NOM_DPTO].count += 1;
        });
        const sorted = Object.entries(deptMap)
          .map(([name, v]) => ({ name, avg: v.sum / v.count }))
          .sort((a, b) => b.avg - a.avg)
          .slice(0, 10);

        const labels = sorted.map(d => d.name.length > 16 ? d.name.slice(0, 16) + '\u2026' : d.name);
        const values = sorted.map(d => parseFloat(d.avg.toFixed(2)));

        if (chartRef.current) {
          chartRef.current.data.labels             = labels;
          chartRef.current.data.datasets[0].data   = values;
          chartRef.current.update();
        } else {
          chartRef.current = new Chart(canvasRef.current, {
            type: 'bar',
            data: {
              labels,
              datasets: [{
                label: 'Precip. promedio (mm)',
                data: values,
                backgroundColor: '#339af0',
                borderColor: '#1a5276',
                borderWidth: 1,
                borderRadius: 3,
              }]
            },
            options: {
              indexAxis: 'y',
              responsive: true,
              maintainAspectRatio: false,
              plugins: { legend: { display: false } },
              scales: {
                x: { title: { display: true, text: 'mm', font: { size: 10 } }, ticks: { font: { size: 10 } } },
                y: { ticks: { font: { size: 10 } } },
              }
            }
          });
        }
      }, [allData]);

      useEffect(() => {
        return () => {
          if (chartRef.current) { chartRef.current.destroy(); chartRef.current = null; }
        };
      }, []);

      return (
        <div className="bg-white rounded-xl shadow-md p-4">
          <h2 className="text-[#1a5276] font-semibold mb-2 text-sm">Top 10 departamentos por precipitaci&oacute;n</h2>
          <div style={{height:'230px', position:'relative'}}>
            <canvas ref={canvasRef} />
          </div>
        </div>
      );
    }

    function TableBox({ data }) {
      const sorted = useMemo(
        () => [...data].sort((a, b) => b.precip_acum_mm - a.precip_acum_mm),
        [data]
      );
      return (
        <div className="bg-white rounded-xl shadow-md p-4">
          <h2 className="text-[#1a5276] font-semibold mb-2 text-sm">Municipios</h2>
          <div className="table-scroll">
            <table className="w-full text-xs">
              <thead className="sticky top-0 bg-[#eaf0fb]">
                <tr>
                  <th className="text-left py-1.5 px-2 text-[#1a5276] font-semibold">Municipio</th>
                  <th className="text-left py-1.5 px-2 text-[#1a5276] font-semibold hidden sm:table-cell">Dpto.</th>
                  <th className="text-right py-1.5 px-2 text-[#1a5276] font-semibold">mm</th>
                  <th className="text-center py-1.5 px-2 text-[#1a5276] font-semibold">Alerta</th>
                </tr>
              </thead>
              <tbody>
                {sorted.map((d, i) => (
                  <tr key={d.COD_MPIO || i} className="border-t border-gray-100 hover:bg-[#eaf0fb] transition-colors">
                    <td className="py-1 px-2">{d.NOM_MPIO}</td>
                    <td className="py-1 px-2 text-gray-400 text-[11px] hidden sm:table-cell">{d.NOM_DPTO}</td>
                    <td className="py-1 px-2 text-right font-mono text-[#1a5276]">{d.precip_acum_mm}</td>
                    <td className="py-1 px-2 text-center" title={d.alerta_compuesta}>
                      {d.alerta > 0 ? '\uD83D\uDD34' : '\uD83D\uDFE2'}
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      );
    }

    // ─── Cartera Analysis Box ─────────────────────────────────────────────────

    function CarteraBox({ alertaHistData, allData, dataFecha }) {
      const [carteraData,   setCarteraData]   = useState(null);
      const [carteraResult, setCarteraResult] = useState(null);
      const [carteraError,  setCarteraError]  = useState(null);
      const fileRef = useRef(null);

      function downloadSample() {
        const url = 'data/cartera_municipios_codigos.csv';
        const a   = document.createElement('a');
        a.href = url; a.download = 'cartera_municipios_codigos.csv'; a.click();
      }

      function handleFile(e) {
        const file = e.target.files[0];
        if (!file) return;
        setCarteraError(null); setCarteraData(null); setCarteraResult(null);

        Papa.parse(file, {
          header: true,
          skipEmptyLines: true,
          complete: ({ data, errors }) => {
            if (errors.length) console.warn('Cartera CSV warnings:', errors);
            if (!data.length) { setCarteraError('El archivo está vacío.'); return; }

            const firstRow = data[0];
            const keys     = Object.keys(firstRow);

            // Detect columns flexibly
            const codCol    = keys.find(k => /cod/i.test(k) && /mpio|muni/i.test(k))
                           ?? keys.find(k => /cod/i.test(k))
                           ?? keys[0];
            const carteraCol = keys.find(k => /cartera/i.test(k));
            const nameCol    = keys.find(k => /nom/i.test(k) && /mpio|muni/i.test(k))
                            ?? keys.find(k => /nombre|name/i.test(k));

            if (!carteraCol) {
              setCarteraError('No se encontró columna "cartera_total" en el archivo. Verifique el formato.');
              return;
            }

            let totalCartera = 0, cartaAlta = 0, nTotal = 0, nAlta = 0;
            const merged = [];

            data.forEach(r => {
              const cod    = (r[codCol] ?? '').toString().trim();
              const val    = parseFloat((r[carteraCol] ?? '').toString().replace(/[^0-9.-]/g,'')) || 0;
              const nombre = nameCol ? (r[nameCol] ?? cod) : cod;
              // Look up alerta from loaded historical data, fallback to allData
              const alerta = alertaHistData[cod]
                          ?? alertaHistData[cod.padStart(5,'0')]
                          ?? 'Sin datos';
              totalCartera += val; nTotal++;
              if (alerta === 'ALTA') { cartaAlta += val; nAlta++; }
              merged.push({ cod, nombre, cartera_total: val, alerta_lluvias: alerta, _col: carteraCol });
            });

            const indicator = totalCartera > 0
              ? (cartaAlta / totalCartera * 100).toFixed(2)
              : '0.00';

            setCarteraData(merged);
            setCarteraResult({ totalCartera, cartaAlta, indicator, nTotal, nAlta, carteraCol });
          },
          error: err => setCarteraError('Error al leer el archivo: ' + err.message),
        });
        e.target.value = '';
      }

      function handleExportCSV() {
        if (!carteraData) return;
        const headers = ['cod','nombre','cartera_total','alerta_lluvias'];
        const rows    = carteraData.map(r =>
          [r.cod, `"${r.nombre}"`, r.cartera_total, r.alerta_lluvias].join(',')
        );
        const csv  = '\uFEFF' + [headers.join(','), ...rows].join('\r\n');
        const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
        const url  = URL.createObjectURL(blob);
        const a    = document.createElement('a');
        a.href = url; a.download = 'cartera_alerta_lluvias.csv'; a.click();
        URL.revokeObjectURL(url);
      }

      const fmtM = v => (v / 1e6).toFixed(1) + ' M';

      return (
        <div className="bg-white rounded-xl shadow-md p-4">
          <h2 className="text-[#1a5276] font-semibold mb-3 text-sm">Análisis de Cartera</h2>

          {/* Action buttons */}
          <div className="flex gap-2 flex-wrap mb-3">
            <button
              onClick={downloadSample}
              className="flex items-center gap-1.5 text-xs bg-[#eaf0fb] hover:bg-[#d0e4f7] text-[#1a5276] font-medium px-3 py-1.5 rounded-lg border border-[#b6d0e8] transition-colors"
            >
              &#x1F4CB; Archivo de ejemplo
            </button>
            <button
              onClick={() => fileRef.current?.click()}
              className="flex items-center gap-1.5 text-xs bg-[#1a5276] hover:bg-[#154360] text-white font-medium px-3 py-1.5 rounded-lg transition-colors"
            >
              &#x1F4C2; Cargar cartera
            </button>
            <input
              ref={fileRef}
              type="file"
              accept=".csv,.xlsx,.xls"
              onChange={handleFile}
              className="hidden"
            />
          </div>

          <p className="text-[11px] text-gray-400 mb-3 leading-tight">
            Cargue un CSV con columnas <code>COD_MPIO</code> y <code>cartera_total</code>.
            Se cruza con la alerta histórica de lluvias.
          </p>

          {/* Error */}
          {carteraError && (
            <div className="text-xs text-[#e03131] bg-red-50 rounded-lg px-3 py-2 mb-2">
              &#x26A0; {carteraError}
            </div>
          )}

          {/* Results */}
          {carteraResult && (
            <div>
              {/* Indicator */}
              <div className="bg-[#1a5276] text-white rounded-lg px-4 py-3 mb-3 text-center">
                <div className="text-2xl font-bold">{carteraResult.indicator}%</div>
                <div className="text-[11px] text-blue-200 mt-0.5">
                  Cartera en alerta ALTA / Cartera total
                </div>
              </div>

              {/* KPIs */}
              <div className="grid grid-cols-2 gap-2 mb-3 text-xs">
                <div className="bg-red-50 border border-red-200 rounded-lg p-2">
                  <div className="font-bold text-[#e03131] text-sm">
                    {fmtM(carteraResult.cartaAlta)} COP
                  </div>
                  <div className="text-gray-500 mt-0.5">
                    Cartera en alerta ALTA
                    <span className="ml-1 text-[#e03131]">({carteraResult.nAlta} mpios)</span>
                  </div>
                </div>
                <div className="bg-[#eaf0fb] border border-[#b6d0e8] rounded-lg p-2">
                  <div className="font-bold text-[#1a5276] text-sm">
                    {fmtM(carteraResult.totalCartera)} COP
                  </div>
                  <div className="text-gray-500 mt-0.5">
                    Cartera total
                    <span className="ml-1 text-[#1a5276]">({carteraResult.nTotal} mpios)</span>
                  </div>
                </div>
              </div>

              {/* Export buttons */}
              <div className="flex gap-2">
                <button
                  onClick={() => exportReportePDF(carteraResult, carteraData, dataFecha)}
                  className="flex-1 text-xs bg-[#e03131] hover:bg-[#c0392b] text-white font-medium px-3 py-1.5 rounded-lg transition-colors"
                >
                  &#x1F4C4; Exportar PDF
                </button>
                <button
                  onClick={handleExportCSV}
                  className="flex-1 text-xs bg-[#27ae60] hover:bg-[#1e8449] text-white font-medium px-3 py-1.5 rounded-lg transition-colors"
                >
                  &#x1F4BE; Exportar CSV
                </button>
              </div>
            </div>
          )}
        </div>
      );
    }

    function SidePanel({ data, allData, departments, deptFilter, alertOnly, onDeptChange, onAlertToggle,
                         alertaHistData, dataFecha }) {
      return (
        <div className="flex flex-col gap-3 lg:w-[35%]">
          <FilterBox
            departments={departments}
            deptFilter={deptFilter}
            alertOnly={alertOnly}
            onDeptChange={onDeptChange}
            onAlertToggle={onAlertToggle}
            allData={allData}
            dataFecha={dataFecha}
          />
          <StatsBox filteredCount={data.length} total={allData.length} />
          <ChartBox allData={allData} />
          <TableBox data={data} />
          <CarteraBox alertaHistData={alertaHistData} allData={allData} dataFecha={dataFecha} />
        </div>
      );
    }

    // ─── App ──────────────────────────────────────────────────────────────────

    function App() {
      const [allData,         setAllData]         = useState([]);
      const [alertaHistData,  setAlertaHistData]   = useState({});
      const [amenazasData,    setAmenazasData]     = useState({});
      const [deptFilter,      setDeptFilter]       = useState('ALL');
      const [alertOnly,       setAlertOnly]        = useState(false);
      const [loading,         setLoading]          = useState(true);
      const [error,           setError]            = useState(null);
      const [activeMap,       setActiveMap]        = useState('lluvias');

      // Load daily precipitation data
      useEffect(() => {
        Papa.parse('data/datos_municipios.csv', {
          download:       true,
          header:         true,
          skipEmptyLines: true,
          encoding:       'UTF-8',
          complete: ({ data, errors }) => {
            if (errors.length) console.warn('CSV warnings:', errors);
            setAllData(parseRows(data));
            setLoading(false);
          },
          error: err => {
            const isFileProtocol = window.location.protocol === 'file:';
            const hint = isFileProtocol
              ? 'Abre el archivo desde un servidor local (ej: Live Server en VS Code o "python -m http.server").'
              : 'Verifica que datos_municipios.csv exista en la carpeta data/.';
            const msg = (err && typeof err.message === 'string' && !err.message.includes('ProgressEvent'))
              ? err.message : hint;
            setError(msg);
            setLoading(false);
          }
        });
      }, []);

      // Load historical alert data (alerta_lluvias per municipality)
      useEffect(() => {
        Papa.parse('data/alerta_historica_municipal.csv', {
          download:       true,
          header:         true,
          skipEmptyLines: true,
          encoding:       'UTF-8',
          complete: ({ data }) => {
            const map = {};
            data.forEach(r => {
              const cod = (r['COD_MPIO'] ?? r['\uFEFFCOD_MPIO'] ?? '').toString().trim();
              if (cod) map[cod] = (r.alerta_lluvias ?? 'BAJA').trim();
            });
            setAlertaHistData(map);
          },
          error: err => console.warn('No se pudo cargar alerta_historica_municipal.csv:', err),
        });
      }, []);

      // Load amenazas municipales (SGC raster + IDEAM daily landslide alerts)
      useEffect(() => {
        Papa.parse('data/amenazas_municipal.csv', {
          download:       true,
          header:         true,
          skipEmptyLines: true,
          encoding:       'UTF-8',
          complete: ({ data }) => {
            const map = {};
            data.forEach(r => {
              const cod = (r['cod_divipola'] ?? r['\uFEFFcod_divipola'] ?? '').toString().trim();
              if (cod) map[cod] = {
                amenaza_mm:           (r.amenaza_mm           ?? '').trim(),
                amenaza_mm_val:       parseInt(r.amenaza_mm_val) || 0,
                alerta_deslizamiento: (r.alerta_deslizamiento ?? '').trim(),
                acum_3dias_mm:        parseFloat(r.acum_3dias_mm)  || null,
                acum_10dias_mm:       parseFloat(r.acum_10dias_mm) || null,
                dias_lluvia:          parseFloat(r.dias_lluvia)    || null,
                fecha_ideam:          (r.fecha_ideam ?? '').trim(),
                lat:                  parseFloat(r.LATITUD),
                lon:                  parseFloat(r.LONGITUD),
                nom_mpio:             (r.NOM_MPIO ?? '').trim(),
                nom_dpto:             (r.NOM_DPTO ?? '').trim(),
              };
            });
            setAmenazasData(map);
          },
          error: err => console.warn('No se pudo cargar amenazas_municipal.csv:', err),
        });
      }, []);

      const filteredData = useMemo(() => {
        return allData
          .filter(d => deptFilter === 'ALL' || d.NOM_DPTO === deptFilter)
          .filter(d => !alertOnly || d.alerta > 0);
      }, [allData, deptFilter, alertOnly]);

      const kpis = useMemo(() => computeKpis(allData), [allData]);

      const departments = useMemo(() => {
        const set = new Set(allData.map(d => d.NOM_DPTO));
        return ['ALL', ...Array.from(set).sort()];
      }, [allData]);

      // Fecha de los datos: toma el primer valor no vacío del campo fecha
      const dataFecha = useMemo(() => {
        const row = allData.find(d => d.fecha && d.fecha !== '');
        return row ? row.fecha : null;
      }, [allData]);

      if (loading) return <LoadingScreen />;
      if (error)   return <ErrorScreen message={error} />;

      return (
        <div className="min-h-screen bg-[#eaf0fb]">
          <LandingHero />
          <div id="dashboard">
          <Header dataFecha={dataFecha} />
          <main className="p-4">
            <KpiCards kpis={kpis} activeMap={activeMap} amenazasData={amenazasData} />
            <div className="flex flex-col lg:flex-row gap-4">
              <div className="lg:w-[65%]">
                {/* Tabs selector */}
                <div className="flex gap-2 mb-2">
                  <button
                    onClick={() => setActiveMap('lluvias')}
                    className={`flex items-center gap-1.5 text-sm font-semibold px-4 py-1.5 rounded-lg border transition-colors ${
                      activeMap === 'lluvias'
                        ? 'bg-[#1a5276] text-white border-[#1a5276]'
                        : 'bg-white text-[#1a5276] border-[#b6d0e8] hover:bg-[#eaf0fb]'
                    }`}
                  >
                    &#x1F327;&#xFE0F; Alertas Lluvias
                  </button>
                  <button
                    onClick={() => setActiveMap('sequias')}
                    className={`flex items-center gap-1.5 text-sm font-semibold px-4 py-1.5 rounded-lg border transition-colors ${
                      activeMap === 'sequias'
                        ? 'bg-[#b7770d] text-white border-[#b7770d]'
                        : 'bg-white text-[#b7770d] border-[#f0d9a0] hover:bg-[#fef9ec]'
                    }`}
                  >
                    &#x2600;&#xFE0F; Alertas Sequ&iacute;as
                  </button>
                  <button
                    onClick={() => setActiveMap('deslizamientos')}
                    className={`flex items-center gap-1.5 text-sm font-semibold px-4 py-1.5 rounded-lg border transition-colors ${
                      activeMap === 'deslizamientos'
                        ? 'bg-[#7b3f00] text-white border-[#7b3f00]'
                        : 'bg-white text-[#7b3f00] border-[#d4a875] hover:bg-[#fdf5ec]'
                    }`}
                  >
                    &#x26F0;&#xFE0F; Alertas Deslizamientos
                  </button>
                </div>
                {/* Mapa Lluvias */}
                <div style={{display: activeMap === 'lluvias' ? 'block' : 'none'}}>
                  <MapPanel data={filteredData} mode="lluvias" visible={activeMap === 'lluvias'} />
                </div>
                {/* Mapa Sequías */}
                <div style={{display: activeMap === 'sequias' ? 'block' : 'none'}}>
                  <MapPanel data={filteredData} mode="sequias" visible={activeMap === 'sequias'} />
                </div>
                {/* Mapa Deslizamientos */}
                <div style={{display: activeMap === 'deslizamientos' ? 'block' : 'none'}}>
                  <DeslizMapPanel amenazasData={amenazasData} visible={activeMap === 'deslizamientos'} />
                </div>
              </div>
              <SidePanel
                data={filteredData}
                allData={allData}
                departments={departments}
                deptFilter={deptFilter}
                alertOnly={alertOnly}
                onDeptChange={setDeptFilter}
                onAlertToggle={() => setAlertOnly(v => !v)}
                alertaHistData={alertaHistData}
                dataFecha={dataFecha}
              />
            </div>
          </main>
          </div>
        </div>
      );
    }

    // ─── Bootstrap ────────────────────────────────────────────────────────────

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
