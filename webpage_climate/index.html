<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Circular 0015 indicadores</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><circle cx='32' cy='32' r='32' fill='%230a0f1a'/><path d='M12 44 Q20 20 32 28 Q44 36 52 12' stroke='%23c8a96e' stroke-width='4' fill='none' stroke-linecap='round'/><path d='M22 52 Q26 30 32 36 Q38 42 44 24' stroke='%234fa89b' stroke-width='2.5' fill='none' stroke-linecap='round'/></svg>">

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

  <!-- Google Fonts: Cinematic Earth Intelligence -->
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Lora:ital,wght@0,400;0,500;1,400&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-primary:    #0a0f1a;
      --bg-secondary:  #0d1a12;
      --bg-card:       #111827;
      --bg-card-hover: #1a2535;
      --accent-gold:   #c8a96e;
      --accent-teal:   #4fa89b;
      --text-primary:  #f5f0e8;
      --text-muted:    #8a9ab0;
      --danger:        #c0392b;
      --warning:       #e67e22;
      --border:        rgba(200,169,110,0.15);
      --border-strong: rgba(200,169,110,0.35);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      background: var(--bg-primary);
      color: var(--text-primary);
      font-family: 'Lora', Georgia, serif;
      min-height: 100vh;
    }

    /* ── Scrollbar ─────────────────────────────────────── */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg-primary); }
    ::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--accent-gold); }

    /* ── Video Hero ─────────────────────────────────────── */
    .hero-section {
      position: relative;
      height: 100vh;
      min-height: 600px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .hero-video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 0;
    }
    .hero-overlay {
      position: absolute;
      inset: 0;
      background: rgba(6, 10, 18, 0.72);
      z-index: 1;
    }
    /* Hide any watermark burned into the video */
    .hero-video { filter: brightness(1.05) saturate(1.1); }

    .hero-content {
      position: relative;
      z-index: 2;
      text-align: center;
      padding: 0 32px;
      max-width: 780px;
      opacity: 0;
      animation: heroFadeIn 2.4s cubic-bezier(0.16,1,0.3,1) 0.3s forwards;
    }
    @keyframes heroFadeIn {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .hero-eyebrow {
      font-family: 'DM Mono', monospace;
      font-size: 10px;
      letter-spacing: 0.32em;
      color: var(--accent-gold);
      text-transform: uppercase;
      margin-bottom: 28px;
      opacity: 0.85;
    }
    .hero-title {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-weight: 300;
      font-size: clamp(22px, 3.2vw, 44px);
      color: rgba(245,240,232,0.70);
      line-height: 1.2;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      margin-bottom: 10px;
    }
    .hero-title-main {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-weight: 600;
      font-size: clamp(64px, 12vw, 130px);
      color: #ffffff;
      line-height: 0.92;
      letter-spacing: -0.02em;
      display: block;
      margin-bottom: 18px;
    }
    .hero-rule {
      width: 40px;
      height: 1px;
      background: var(--accent-gold);
      opacity: 0.55;
      margin: 28px auto;
    }
    .hero-desc {
      font-family: 'Lora', serif;
      font-size: clamp(13px, 1.5vw, 15px);
      color: rgba(245,240,232,0.72);
      line-height: 1.7;
      max-width: 600px;
      margin: 0 auto 28px;
    }
    .hero-sub {
      font-family: 'DM Mono', monospace;
      font-size: 10px;
      letter-spacing: 0.22em;
      color: rgba(138,154,176,0.75);
      text-transform: uppercase;
    }
    .hero-corner {
      position: absolute;
      width: 22px; height: 22px;
      z-index: 2;
      opacity: 0.45;
    }
    .hero-corner.tl { top: 28px; left: 28px; border-top: 1px solid var(--accent-gold); border-left: 1px solid var(--accent-gold); }
    .hero-corner.tr { top: 28px; right: 28px; border-top: 1px solid var(--accent-gold); border-right: 1px solid var(--accent-gold); }
    .hero-corner.bl { bottom: 28px; left: 28px; border-bottom: 1px solid var(--accent-gold); border-left: 1px solid var(--accent-gold); }
    .hero-corner.br { bottom: 28px; right: 28px; border-bottom: 1px solid var(--accent-gold); border-right: 1px solid var(--accent-gold); }
    .hero-scroll {
      position: absolute;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      z-index: 2;
      text-decoration: none;
    }
    .hero-scroll-label {
      font-family: 'DM Mono', monospace;
      font-size: 9px;
      letter-spacing: 0.28em;
      color: rgba(200,169,110,0.55);
      text-transform: uppercase;
    }
    .hero-scroll-line {
      width: 1px;
      height: 40px;
      background: linear-gradient(to bottom, rgba(200,169,110,0.6), transparent);
      animation: scrollLine 2s ease-in-out infinite;
    }
    @keyframes scrollLine {
      0%   { transform: scaleY(0); transform-origin: top; opacity: 0; }
      40%  { transform: scaleY(1); transform-origin: top; opacity: 1; }
      100% { transform: scaleY(1); transform-origin: top; opacity: 0; }
    }

    /* ── Navbar ─────────────────────────────────────────── */
    .navbar {
      position: sticky;
      top: 0;
      z-index: 900;
      padding: 12px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: background 0.35s ease, box-shadow 0.35s ease;
      background: transparent;
    }
    .navbar.scrolled {
      background: rgba(10,15,26,0.96);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      box-shadow: 0 1px 0 var(--border);
    }
    .navbar-logo { display: flex; align-items: center; gap: 14px; }
    .navbar-logo img { height: 42px; object-fit: contain; }
    .navbar-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 15px;
      font-weight: 600;
      color: var(--text-primary);
      line-height: 1.2;
    }
    .navbar-subtitle {
      font-family: 'DM Mono', monospace;
      font-size: 10px;
      color: var(--text-muted);
      letter-spacing: 0.06em;
      margin-top: 3px;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .navbar-date-badge {
      font-family: 'DM Mono', monospace;
      font-size: 10px;
      letter-spacing: 0.08em;
      color: var(--accent-gold);
      border: 1px solid var(--border-strong);
      padding: 3px 9px;
      border-radius: 2px;
      background: rgba(200,169,110,0.07);
    }
    .navbar-source {
      font-family: 'DM Mono', monospace;
      font-size: 10px;
      color: var(--text-muted);
      letter-spacing: 0.06em;
    }
    @media (max-width: 640px) { .navbar-source { display: none; } }

    /* ── Dashboard ──────────────────────────────────────── */
    #dashboard { background: var(--bg-primary); min-height: 100vh; }
    .dashboard-main { padding: 24px 20px; }

    /* ── KPI Grid ───────────────────────────────────────── */
    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
      margin-bottom: 22px;
    }
    @media (min-width: 1024px) { .kpi-grid { grid-template-columns: repeat(4, 1fr); } }
    .kpi-card {
      background: var(--bg-card);
      border-radius: 2px;
      padding: 18px 16px;
      border-left: 3px solid var(--accent-teal);
      border-top: 1px solid var(--border);
      border-right: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      transition: transform 0.22s ease, box-shadow 0.22s ease;
      cursor: default;
    }
    .kpi-card:hover { transform: translateY(-3px); box-shadow: 0 8px 32px rgba(0,0,0,0.5); }
    .kpi-card.accent-red   { border-left-color: var(--danger); }
    .kpi-card.accent-gold  { border-left-color: var(--accent-gold); }
    .kpi-card.accent-green { border-left-color: var(--accent-teal); }
    .kpi-card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 14px;
    }
    .kpi-icon {
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
      opacity: 0.45;
      flex-shrink: 0;
    }
    .kpi-value {
      font-family: 'DM Mono', monospace;
      font-size: 28px;
      font-weight: 500;
      color: var(--accent-gold);
      line-height: 1;
      margin-bottom: 6px;
      letter-spacing: -0.5px;
    }
    .kpi-label {
      font-family: 'Inter', 'DM Sans', sans-serif;
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-muted);
    }
    .kpi-sub {
      font-family: 'DM Mono', monospace;
      font-size: 10px;
      color: var(--text-muted);
      margin-top: 6px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      opacity: 0.7;
    }

    /* ── Map layout ─────────────────────────────────────── */
    .map-layout {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    @media (min-width: 1024px) {
      .map-layout { flex-direction: row; }
      .map-main { width: 65%; }
      .map-side { width: 35%; }
    }
    .map-div { height: 520px; }
    @media (max-width: 768px) { .map-div { height: 340px; } }
    .map-panel-wrap {
      background: var(--bg-card);
      border-radius: 2px;
      border: 1px solid var(--border);
      overflow: hidden;
      position: relative;
    }

    /* ── Tab bar ─────────────────────────────────────────── */
    .tab-bar { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
    .tab-btn {
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      letter-spacing: 0.06em;
      padding: 8px 16px;
      border-radius: 2px;
      border: 1px solid var(--border-strong);
      background: var(--bg-card);
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .tab-btn:hover { color: var(--text-primary); border-color: var(--accent-gold); }
    .tab-btn.active-lluvias { background: rgba(79,168,155,0.15); color: var(--accent-teal); border-color: var(--accent-teal); }
    .tab-btn.active-sequias { background: rgba(230,126,34,0.15); color: var(--warning); border-color: var(--warning); }
    .tab-btn.active-desliz  { background: rgba(200,169,110,0.12); color: var(--accent-gold); border-color: var(--accent-gold); }

    /* ── Legend ─────────────────────────────────────────── */
    .map-legend {
      position: absolute;
      bottom: 28px;
      left: 10px;
      z-index: 1000;
      background: rgba(10,15,26,0.90);
      border: 1px solid var(--border);
      border-radius: 2px;
      padding: 12px 14px;
      pointer-events: none;
      backdrop-filter: blur(8px);
    }
    .legend-title {
      font-family: 'DM Mono', monospace;
      font-size: 9px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--accent-gold);
      margin-bottom: 8px;
    }
    .legend-item { display: flex; align-items: center; gap: 7px; margin-bottom: 4px; }
    .legend-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
    .legend-label { color: var(--text-muted); font-family: 'DM Mono', monospace; font-size: 10px; }
    .legend-divider { border: none; border-top: 1px solid var(--border); margin: 6px 0; }

    /* ── Side panel ─────────────────────────────────────── */
    .side-panel { display: flex; flex-direction: column; gap: 14px; }
    .panel-card {
      background: var(--bg-card);
      border-radius: 2px;
      border: 1px solid var(--border);
      padding: 18px;
    }
    .panel-card-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 15px;
      font-weight: 600;
      color: var(--accent-gold);
      letter-spacing: 0.04em;
      margin-bottom: 14px;
    }

    /* ── Form controls ──────────────────────────────────── */
    .form-label {
      font-family: 'DM Mono', monospace;
      font-size: 9px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--text-muted);
      display: block;
      margin-bottom: 6px;
    }
    .form-select {
      width: 100%;
      background: var(--bg-primary);
      border: 1px solid var(--border-strong);
      border-radius: 2px;
      padding: 9px 12px;
      font-family: 'Lora', serif;
      font-size: 13px;
      color: var(--text-primary);
      outline: none;
      cursor: pointer;
      appearance: none;
      -webkit-appearance: none;
    }
    .form-select:focus { border-color: var(--accent-gold); }
    .form-select option { background: var(--bg-card); color: var(--text-primary); }
    .form-checkbox-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 14px;
      cursor: pointer;
    }
    .form-checkbox { width: 15px; height: 15px; accent-color: var(--danger); cursor: pointer; }
    .form-checkbox-label { font-family: 'Lora', serif; font-size: 13px; color: var(--text-primary); }

    /* ── Buttons ─────────────────────────────────────────── */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-family: 'DM Mono', monospace;
      font-size: 10px;
      letter-spacing: 0.10em;
      text-transform: uppercase;
      padding: 8px 14px;
      border-radius: 2px;
      border: 1px solid transparent;
      cursor: pointer;
      transition: all 0.2s ease;
      background: none;
    }
    .btn-primary { background: rgba(200,169,110,0.10); border-color: var(--border-strong); color: var(--accent-gold); }
    .btn-primary:hover { background: rgba(200,169,110,0.20); }
    .btn-danger { background: rgba(192,57,43,0.12); border-color: rgba(192,57,43,0.38); color: var(--danger); }
    .btn-danger:hover { background: rgba(192,57,43,0.25); }
    .btn-success { background: rgba(79,168,155,0.12); border-color: rgba(79,168,155,0.35); color: var(--accent-teal); }
    .btn-success:hover { background: rgba(79,168,155,0.24); }
    .btn-dark { background: rgba(138,154,176,0.08); border-color: var(--border); color: var(--text-muted); }
    .btn-dark:hover { color: var(--text-primary); border-color: var(--border-strong); }
    .btn-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }

    /* ── Stats box ──────────────────────────────────────── */
    .stats-box {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 2px;
      padding: 12px 18px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .stats-count { font-family: 'DM Mono', monospace; font-size: 20px; font-weight: 500; color: var(--accent-gold); }
    .stats-label { font-family: 'Lora', serif; font-size: 13px; color: var(--text-muted); }

    /* ── Table ──────────────────────────────────────────── */
    .table-scroll { max-height: 260px; overflow-y: auto; }
    .data-table { width: 100%; border-collapse: collapse; }
    .data-table th {
      font-family: 'DM Mono', monospace;
      font-size: 9px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--accent-gold);
      padding: 8px 8px;
      text-align: left;
      position: sticky;
      top: 0;
      background: var(--bg-card);
      border-bottom: 1px solid var(--border);
    }
    .data-table th.right { text-align: right; }
    .data-table th.center { text-align: center; }
    .data-table td {
      padding: 7px 8px;
      border-bottom: 1px solid rgba(200,169,110,0.06);
      color: var(--text-primary);
      font-family: 'Lora', serif;
      font-size: 12px;
    }
    .data-table tr:hover td { background: rgba(200,169,110,0.04); }
    .td-right { text-align: right; font-family: 'DM Mono', monospace; color: var(--accent-gold); }
    .td-center { text-align: center; }
    .td-muted { color: var(--text-muted); font-size: 11px; }
    @media (max-width: 640px) { .hide-sm { display: none; } }

    /* ── Cartera ────────────────────────────────────────── */
    .indicator-box {
      background: rgba(200,169,110,0.07);
      border: 1px solid var(--border-strong);
      border-radius: 2px;
      padding: 18px;
      text-align: center;
      margin-bottom: 14px;
    }
    .indicator-value { font-family: 'DM Mono', monospace; font-size: 34px; font-weight: 500; color: var(--accent-gold); }
    .indicator-label { font-family: 'Lora', serif; font-size: 11px; color: var(--text-muted); margin-top: 4px; }
    .cartera-kpi-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
    .cartera-kpi {
      background: var(--bg-primary);
      border: 1px solid var(--border);
      border-radius: 2px;
      padding: 12px;
    }
    .cartera-kpi.danger { border-color: rgba(192,57,43,0.35); }
    .cartera-kpi-value { font-family: 'DM Mono', monospace; font-size: 14px; font-weight: 500; color: var(--accent-gold); }
    .cartera-kpi.danger .cartera-kpi-value { color: var(--danger); }
    .cartera-kpi-label { font-family: 'Lora', serif; font-size: 10px; color: var(--text-muted); margin-top: 4px; }
    .error-box {
      background: rgba(192,57,43,0.10);
      border: 1px solid rgba(192,57,43,0.30);
      border-radius: 2px;
      padding: 10px 14px;
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      color: var(--danger);
      margin-bottom: 10px;
    }
    .hint-text { font-family: 'Lora', serif; font-size: 11px; color: var(--text-muted); line-height: 1.55; margin-bottom: 12px; }
    code {
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      background: rgba(200,169,110,0.08);
      padding: 2px 5px;
      border-radius: 2px;
      color: var(--accent-gold);
    }

    /* ── Scroll reveal ──────────────────────────────────── */
    .reveal { opacity: 0; transform: translateY(22px); transition: opacity 0.7s ease, transform 0.7s ease; }
    .reveal.visible { opacity: 1; transform: translateY(0); }

    /* ── Pulse animations ───────────────────────────────── */
    @keyframes pulse-ring {
      0%   { transform: scale(1);   opacity: 0.9; }
      70%  { transform: scale(2.4); opacity: 0;   }
      100% { transform: scale(2.4); opacity: 0;   }
    }
    .alert-pulse { animation: pulse-ring 1.8s ease-out infinite; border-radius: 50%; border: 2px solid #e03131; position: absolute; pointer-events: none; }
    .sequia-pulse { animation: pulse-ring 1.8s ease-out infinite; animation-delay: -0.9s; border-radius: 50%; border: 2.5px solid #7a4419; position: absolute; pointer-events: none; }
    .sequia-alert-pulse { animation: pulse-ring 1.8s ease-out infinite; animation-delay: -0.45s; border-radius: 50%; border: 2.5px solid #f0b429; position: absolute; pointer-events: none; }

    /* ── Loading / Error ────────────────────────────────── */
    .loading-screen { min-height: 100vh; background: var(--bg-primary); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; }
    .loading-spinner { width: 44px; height: 44px; border: 2px solid var(--border); border-top-color: var(--accent-gold); border-radius: 50%; animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-label { font-family: 'DM Mono', monospace; font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--text-muted); }
    .error-screen { min-height: 100vh; background: var(--bg-primary); display: flex; align-items: center; justify-content: center; }
    .error-card { background: var(--bg-card); border: 1px solid rgba(192,57,43,0.35); border-radius: 2px; padding: 40px 48px; max-width: 480px; text-align: center; }
    .error-icon { font-size: 36px; margin-bottom: 16px; }
    .error-title { font-family: 'Cormorant Garamond', serif; font-size: 22px; color: var(--danger); margin-bottom: 10px; }
    .error-message { font-family: 'Lora', serif; font-size: 13px; color: var(--text-muted); }

    /* ── Footer ─────────────────────────────────────────── */
    .site-footer {
      background: var(--bg-card);
      border-top: 1px solid var(--border);
      padding: 32px 24px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      flex-wrap: wrap;
      gap: 24px;
      margin-top: 48px;
    }
    .footer-brand { font-family: 'Cormorant Garamond', serif; font-size: 17px; font-weight: 600; color: var(--accent-gold); }
    .footer-sub { font-family: 'DM Mono', monospace; font-size: 9px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--text-muted); margin-top: 5px; }
    .footer-sources { font-family: 'Lora', serif; font-size: 11px; color: var(--text-muted); text-align: right; }
    .footer-sources strong { color: var(--text-primary); font-weight: 500; }
    .footer-sources div { margin-top: 5px; }

    // ─── Helpers ──────────────────────────────────────────────────────────────

    function precipCategoria(mm) {
      if (mm <= 0)  return 'Sin lluvia (0 mm)';
      if (mm <  5)  return 'Muy ligera (< 5 mm)';
      if (mm < 15)  return 'Ligera (5–15 mm)';
      if (mm < 30)  return 'Moderada (15–30 mm)';
      if (mm < 60)  return 'Fuerte (30–60 mm)';
      return 'Extrema (≥ 100 mm)';
    }

    function precipTamano(mm) {
      return Math.max(5, Math.min(Math.sqrt(mm + 1) * 2.8 + 4, 22));
    }

    const ALERTA_NIVEL = { 'BAJA': 0, 'MODERADA': 1, 'ALTA': 2, 'CRÍTICA': 3 };

    function parseRows(raw) {
      return raw.map(r => {
        const cod                  = r['COD_MPIO'] ?? r['﻿COD_MPIO'] ?? '';
        const mm                   = parseFloat(r.precip_acum_mm) || 0;
        const alerta_compuesta_raw = (r.alerta_compuesta ?? 'BAJA').trim();
        const afectado             = parseInt(r.municipio_afectado) || 0;
        const alerta_compuesta     = alerta_compuesta_raw;
        const alert                = ALERTA_NIVEL[alerta_compuesta] ?? 0;
        return {
          COD_MPIO:            String(cod),
          NOM_MPIO:            (r.NOM_MPIO         ?? '').trim(),
          NOM_DPTO:            (r.NOM_DPTO         ?? '').trim(),
          LATITUD:             parseFloat(r.LATITUD),
          LONGITUD:            parseFloat(r.LONGITUD),
          precip_acum_mm:      mm,
          precip_max_10min:    parseFloat(r.precip_max_10min)    || 0,
          n_estaciones:        parseInt(r.n_estaciones, 10)      || 0,
          alerta:              alert,
          alerta_compuesta,
          alerta_compuesta_raw,
          frecuencia_extremos: parseFloat(r.frecuencia_extremos) || 0,
          frecuencia_reciente: parseFloat(r.frecuencia_reciente) || 0,
          ratio_reciente:      parseFloat(r.ratio_reciente)      || 0,
          tendencia:           (r.tendencia         ?? 'sin_datos').trim(),
          fecha:               (r.fecha             ?? '').trim(),
          sequia_categoria:    (r.sequia_categoria   ?? 'NORMAL').trim(),
          categoria:           r.categoria ? r.categoria.trim() : precipCategoria(mm),
          tamano:              parseFloat(r['tamaño']) || precipTamano(mm),
          municipio_afectado:  afectado,
        };
      }).filter(r => !isNaN(r.LATITUD) && !isNaN(r.LONGITUD));
    }

    function computeKpis(data) {
      if (!data.length) return { total: 0, enAlerta: 0, enAlertaSequia: 0, promedio: '0.00', maximo: 0, maxMpio: '' };
      const total          = data.length;
      const enAlerta       = data.filter(d => d.alerta >= 2).length;   // ALTA + CRÍTICA
      const enAlertaSequia = data.filter(d => d.sequia_categoria === 'SEVERA').length;
      const sum            = data.reduce((acc, d) => acc + d.precip_acum_mm, 0);
      const promedio       = (sum / total).toFixed(2);
      const maxRow         = data.reduce((a, b) => b.precip_acum_mm > a.precip_acum_mm ? b : a);
      return { total, enAlerta, enAlertaSequia, promedio, maximo: maxRow.precip_acum_mm, maxMpio: maxRow.NOM_MPIO };
    }

    function downloadCSV(data, filename) {
      if (!data.length) return;
      const headers = ['COD_MPIO','NOM_MPIO','NOM_DPTO','precip_acum_mm','precip_max_10min',
                       'alerta_compuesta','frecuencia_extremos','frecuencia_reciente',
                       'ratio_reciente','tendencia','sequia_categoria','n_estaciones','fecha'];
      const rows = data.map(r =>
        headers.map(h => {
          const v = r[h] ?? '';
          return typeof v === 'string' && v.includes(',') ? `"${v}"` : v;
        }).join(',')
      );
      const csv  = '﻿' + [headers.join(','), ...rows].join('\r\n');
      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const url  = URL.createObjectURL(blob);
      const a    = document.createElement('a');
      a.href = url; a.download = filename; a.click();
      URL.revokeObjectURL(url);
    }

        <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" strokeWidth="1.4" strokeLinecap="round" strokeLinejoin="round">
          <path d="M9 2L15 4.5v5c0 3.5-2.5 6-6 7-3.5-1-6-3.5-6-7V4.5L9 2z"/>
          <polyline points="6.5,9 8,10.5 11.5,7"/>
        </svg>
      ),
    };

    function KpiCard({ label, value, sub, icon, accent }) {
      const cls = accent ? `kpi-card accent-${accent}` : 'kpi-card';
      return (
        <div className={cls}>
          <div className="kpi-card-header">
            <div className="kpi-label">{label}</div>
            <div className="kpi-icon">{icon}</div>
          </div>
          <div className="kpi-value">{value}</div>
          {sub && <div className="kpi-sub" title={sub}>{sub}</div>}
        </div>
      );
    }

    function KpiCards({ kpis, activeMap, amenazasData }) {
      const alertaValue = activeMap === 'sequias'
        ? kpis.enAlertaSequia
        : activeMap === 'deslizamientos'
        ? Object.values(amenazasData).filter(d => d.alerta_deslizamiento === 'ALTA').length
        : kpis.enAlerta;
      const alertaLabel = activeMap === 'sequias'       ? 'Sequía severa'
                        : activeMap === 'deslizamientos' ? 'Alerta deslizamiento'
                        : 'Municipios en alerta';
      const alertaAccent = activeMap === 'sequias' ? 'gold' : 'red';
      return (
        <div className="kpi-grid reveal">
          <KpiCard label="Municipios monitoreados"           value={kpis.total}            icon={ICONS.municipios} />
          <KpiCard label={alertaLabel}                       value={alertaValue}           icon={ICONS.alerta}     accent={alertaAccent} />
          <KpiCard label="Precipitaci&#243;n promedio"       value={`${kpis.promedio} mm`} icon={ICONS.precipMedia} accent="green" />
          <KpiCard label="Precipitaci&#243;n m&#225;xima"   value={`${kpis.maximo} mm`}   icon={ICONS.precipMax}  accent="gold" sub={kpis.maxMpio} />
        </div>
      );
    }

    // ─── Legend ───────────────────────────────────────────────────────────────

    function Legend({ mode = 'lluvias' }) {
      return (
        <div className="map-legend">
          {mode === 'lluvias' ? (<>
            <div className="legend-title">Precipitaci&oacute;n</div>
            {LEGEND_ENTRIES.map(e => (
              <div key={e.label} className="legend-item">
                <div className="legend-dot" style={{background: e.color}} />
                <span className="legend-label">{e.label}</span>
              </div>
            ))}
            <hr className="legend-divider" />
            <div className="legend-item">
              <div className="legend-dot" style={{border:'2px solid #e03131', background:'transparent'}} />
              <span className="legend-label">En alerta</span>
            </div>
          </>) : mode === 'deslizamientos' ? (<>
            <div className="legend-title">Amenaza MM &middot; SGC</div>
            {DESLIZ_LEGEND_ENTRIES.map(e => (
              <div key={e.label} className="legend-item">
                <div className="legend-dot" style={{background: e.color}} />
                <span className="legend-label">{e.label}</span>
              </div>
            ))}
            <hr className="legend-divider" />
            <div className="legend-item">
              <div className="legend-dot" style={{border:'2px solid #d91919', background:'transparent'}} />
              <span className="legend-label">Alerta IDEAM activa</span>
            </div>
          </>) : (<>
            <div className="legend-title">Sequ&iacute;a recurrente</div>
            {SEQUIA_LEGEND_ENTRIES.map(e => (
              <div key={e.label} className="legend-item">
                <div className="legend-dot" style={{background: e.color}} />
                <span className="legend-label">{e.label}</span>
              </div>
            ))}
            <hr className="legend-divider" />
            <div className="legend-item">
              <div className="legend-dot" style={{border:'2px solid #f0b429', background:'transparent'}} />
              <span className="legend-label">Alerta SEVERA</span>
            </div>
          </>)}
        </div>
      );
    }

    // ─── Deslizamientos Map Panel ─────────────────────────────────────────────

    function DeslizMapPanel({ amenazasData, visible = true }) {
      const mapDiv      = useRef(null);
      const leafletMap  = useRef(null);
      const geoLayerRef = useRef(null);
      const pulseRef    = useRef(null);
      const initialized = useRef(false);
      const [geoReady, setGeoReady] = useState(!!_municipiosGeo);

      // ── Init mapa (una sola vez) ─────────────────────────────────────────
      useEffect(() => {
        if (initialized.current) return;
        initialized.current = true;

        const map = L.map(mapDiv.current, { center: [4.5, -74.0], zoom: 5 });

        map.createPane('choroPane');
        map.getPane('choroPane').style.zIndex = '350';
        map.getPane('choroPane').style.pointerEvents = 'auto';

        // Basemap limpio sin etiquetas (igual que MapPanel de lluvias)
        L.tileLayer('https://{s}.basemaps.cartocdn.com/light_nolabels/{z}/{x}/{y}{r}.png', {
          attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/">CARTO</a>',
          maxZoom: 19,
        }).addTo(map);

        // Etiquetas encima de los polígonos
        L.tileLayer('https://{s}.basemaps.cartocdn.com/light_only_labels/{z}/{x}/{y}{r}.png', {
          attribution: '', maxZoom: 19,
        }).addTo(map);

        map.fitBounds([[1, -79], [13, -67]]);
        leafletMap.current = map;

        // Reusar caché GeoJSON compartida
        if (_municipiosGeo) {
          setGeoReady(true);
        } else {
          fetch('data/municipios_alertas.geojson')
            .then(r => { if (!r.ok) throw new Error(`HTTP ${r.status}`); return r.json(); })
            .then(geo => { _municipiosGeo = geo; setGeoReady(true); })
            .catch(err => console.error('Error cargando GeoJSON:', err));
        }
      }, []);

      // ── Redimensionar al hacerse visible ────────────────────────────────
      useEffect(() => {
        if (visible && leafletMap.current) {
          setTimeout(() => {
            leafletMap.current.invalidateSize();
            leafletMap.current.fitBounds([[1, -79], [13, -67]]);
          }, 60);
        }
      }, [visible]);

      // ── Limpiar pulso al desmontar ───────────────────────────────────────
      useEffect(() => () => { if (pulseRef.current) clearInterval(pulseRef.current); }, []);

      // ── Dibujar coropleta por amenaza_mm ────────────────────────────────
      useEffect(() => {
        if (!geoReady || !leafletMap.current || !_municipiosGeo) return;

        if (pulseRef.current) { clearInterval(pulseRef.current); pulseRef.current = null; }
        if (geoLayerRef.current) { geoLayerRef.current.remove(); geoLayerRef.current = null; }

        const LABEL = { 'MUY_BAJA':'Muy baja', 'BAJA':'Baja', 'MEDIA':'Media', 'ALTA':'Alta', 'MUY_ALTA':'Muy alta' };

        function getStyle(feature) {
          const cod      = String(feature.properties.COD_MPIO ?? '').replace(/\.0$/, '');
          const d        = amenazasData[cod];
          const nivel    = d?.amenaza_mm ?? '';
          const isMuyAlta = nivel === 'MUY_ALTA';
          const isAlta    = nivel === 'ALTA';
          return {
            pane:        'choroPane',
            fillColor:   AMENAZA_MM_COLORS[nivel] ?? '#d8d4ce',
            fillOpacity: !nivel ? 0.25 : nivel === 'MUY_BAJA' ? 0.45 : nivel === 'BAJA' ? 0.55 : nivel === 'MEDIA' ? 0.65 : 0.82,
            color:       isMuyAlta ? '#7b0000' : isAlta ? '#c05010' : '#bbb',
            weight:      (isMuyAlta || isAlta) ? 1.5 : 0.4,
            opacity:     1,
          };
        }

        const layer = L.geoJSON(_municipiosGeo, {
          style: getStyle,
          onEachFeature(feature, lyr) {
            const cod      = String(feature.properties.COD_MPIO ?? '').replace(/\.0$/, '');
            const d        = amenazasData[cod] ?? {};
            const nivel    = d.amenaza_mm ?? '';
            const color    = AMENAZA_MM_COLORS[nivel] ?? '#adb5bd';
            const label    = LABEL[nivel] ?? 'Sin dato';
            const nom      = d.nom_mpio ?? feature.properties.NOM_MPIO ?? cod;
            const dpto     = d.nom_dpto ?? feature.properties.NOM_DPTO ?? '';
            const hasAlerta = d.alerta_deslizamiento === 'ALTA';
            const alertaBadge = hasAlerta
              ? `<span style="color:#d91919;font-weight:700;">⚠ Amenaza muy alta (SGC)</span>`
              : `<span style="color:#4fa89b;">✓ Sin alerta activa</span>`;
            const popup = `
              <div style="font-family:'Segoe UI',sans-serif;font-size:13px;min-width:200px;">
                <div style="font-size:14px;font-weight:700;margin-bottom:2px;">${nom}</div>
                <div style="color:#888;font-size:12px;margin-bottom:6px;">${dpto}</div>
                <hr style="margin:4px 0;border-color:#eee;">
                <p style="font-size:12px;font-weight:600;color:#e67e22;margin-bottom:4px;">⛰ Amenaza MM — SGC 1:500k</p>
                <p><b>Nivel:</b> <span style="color:${color};font-weight:700;">${label}</span></p>
                <p style="margin-top:5px;">${alertaBadge}</p>
              </div>`;
            lyr.bindPopup(popup, { maxWidth: 240 });
          },
        }).addTo(leafletMap.current);

        geoLayerRef.current = layer;

        // ── Pulso en municipios MUY_ALTA ─────────────────────────────────
        const alertLayers = [];
        layer.eachLayer(lyr => {
          const cod = String(lyr.feature.properties.COD_MPIO ?? '').replace(/\.0$/, '');
          if (amenazasData[cod]?.alerta_deslizamiento === 'ALTA') alertLayers.push(lyr);
        });

        if (alertLayers.length) {
          let hi = true;
          pulseRef.current = setInterval(() => {
            alertLayers.forEach(lyr => lyr.setStyle({ fillOpacity: hi ? 0.92 : 0.40 }));
            hi = !hi;
          }, 800);
        }
      }, [amenazasData, geoReady]);

      return (
        <div className="map-panel-wrap">
          <div ref={mapDiv} className="map-div" />
          <Legend mode="deslizamientos" />
        </div>
      );
    }

    // ─── Map Panel ────────────────────────────────────────────────────────────

    function MapPanel({ data, mode = 'lluvias', visible = true }) {
      const mapDiv      = useRef(null);
      const leafletMap  = useRef(null);
      const geoLayerRef = useRef(null);
      const pulseRef    = useRef(null);
      const initialized = useRef(false);
      const [geoReady, setGeoReady] = useState(!!_municipiosGeo);

      // ── Init mapa (una sola vez) ─────────────────────────────────────────
      useEffect(() => {
        if (initialized.current) return;
        initialized.current = true;

        const map = L.map(mapDiv.current, { center: [4.5, -74.0], zoom: 5 });

        // Pane intermedio para los polígonos (entre base y labels)
        map.createPane('choroPane');
        map.getPane('choroPane').style.zIndex = '350';
        map.getPane('choroPane').style.pointerEvents = 'auto';

        // Basemap limpio sin etiquetas
        L.tileLayer('https://{s}.basemaps.cartocdn.com/light_nolabels/{z}/{x}/{y}{r}.png', {
          attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/">CARTO</a>',
          maxZoom: 19,
        }).addTo(map);

        // Etiquetas encima de polígonos (overlayPane z-index 400)
        L.tileLayer('https://{s}.basemaps.cartocdn.com/light_only_labels/{z}/{x}/{y}{r}.png', {
          attribution: '', maxZoom: 19,
        }).addTo(map);

        map.fitBounds([[1, -79], [13, -67]]);
        leafletMap.current = map;

        // Cargar GeoJSON (usa caché si ya fue cargado)
        if (_municipiosGeo) {
          setGeoReady(true);
        } else {
          fetch('data/municipios_alertas.geojson')
            .then(r => { if (!r.ok) throw new Error(`HTTP ${r.status}`); return r.json(); })
            .then(geo => { _municipiosGeo = geo; setGeoReady(true); })
            .catch(err => console.error('Error cargando GeoJSON:', err));
        }
      }, []);

      // ── Redimensionar al hacerse visible ────────────────────────────────
      useEffect(() => {
        if (visible && leafletMap.current) {
          setTimeout(() => {
            leafletMap.current.invalidateSize();
            leafletMap.current.fitBounds([[1, -79], [13, -67]]);
          }, 60);
        }
      }, [visible]);

      // ── Limpiar intervalo de pulso al desmontar ──────────────────────────
      useEffect(() => () => { if (pulseRef.current) clearInterval(pulseRef.current); }, []);

      // ── Dibujar coropleta ────────────────────────────────────────────────
      useEffect(() => {
        if (!geoReady || !leafletMap.current || !_municipiosGeo) return;

        // Detener pulso anterior
        if (pulseRef.current) { clearInterval(pulseRef.current); pulseRef.current = null; }

        // Lookup rápido: COD_MPIO → fila de datos
        const lookup = {};
        data.forEach(m => { lookup[String(m.COD_MPIO)] = m; });

        // Remover capa anterior
        if (geoLayerRef.current) { geoLayerRef.current.remove(); geoLayerRef.current = null; }

        function getStyle(feature) {
          const cod    = String(feature.properties.COD_MPIO ?? '').replace(/\.0$/, '');
          const row    = lookup[cod] ?? feature.properties;
          const alerta = row.alerta_compuesta ?? 'SIN_DATOS';
          const sequia = row.sequia_categoria ?? 'NORMAL';

          if (mode === 'sequias') {
            const isAlert = sequia === 'SEVERA' || sequia === 'EXTREMA';
            return {
              pane:        'choroPane',
              fillColor:   SEQUIA_POLY_COLORS[sequia] ?? '#d8d4ce',
              fillOpacity: sequia === 'NORMAL' ? 0.50 : 0.75,
              color:       isAlert ? '#a04010' : '#bbb',
              weight:      isAlert ? 1.5 : 0.4,
              opacity:     1,
            };
          }

          const isAlert = alerta === 'ALTA' || alerta === 'CRÍTICA';
          return {
            pane:        'choroPane',
            fillColor:   ALERTA_POLY_COLORS[alerta] ?? '#d8d4ce',
            fillOpacity: alerta === 'SIN_DATOS' ? 0.30 : alerta === 'BAJA' ? 0.52 : 0.78,
            color:       alerta === 'CRÍTICA' ? '#7b0000' : isAlert ? '#c03020' : '#bbb',
            weight:      isAlert ? 1.5 : 0.4,
            opacity:     1,
          };
        }

        const layer = L.geoJSON(_municipiosGeo, {
          style: getStyle,
          onEachFeature(feature, lyr) {
            const cod = String(feature.properties.COD_MPIO ?? '').replace(/\.0$/, '');
            const row = { ...feature.properties, ...(lookup[cod] ?? {}) };
            // Asegurar numéricos para el popup
            row.precip_acum_mm    = Number(row.precip_acum_mm    ?? 0);
            row.precip_max_10min  = Number(row.precip_max_10min  ?? 0);
            row.frecuencia_extremos = Number(row.frecuencia_extremos ?? 0);
            row.frecuencia_reciente = Number(row.frecuencia_reciente ?? 0);
            row.n_estaciones      = Number(row.n_estaciones      ?? 0);
            lyr.bindPopup(buildPopup(row), { maxWidth: 260 });
          },
        }).addTo(leafletMap.current);

        geoLayerRef.current = layer;

        // ── Titilación en municipios con alerta ALTA / CRÍTICA ────────────
        const alertLayers = [];
        layer.eachLayer(lyr => {
          const cod    = String(lyr.feature.properties.COD_MPIO ?? '').replace(/\.0$/, '');
          const row    = lookup[cod] ?? lyr.feature.properties;
          const alerta = row.alerta_compuesta ?? lyr.feature.properties.alerta_compuesta ?? '';
          const sequia = row.sequia_categoria ?? lyr.feature.properties.sequia_categoria ?? '';
          const pulse  = mode === 'sequias'
            ? (sequia === 'SEVERA'  || sequia === 'EXTREMA')
            : (alerta === 'ALTA'   || alerta === 'CRÍTICA');
          if (pulse) alertLayers.push({ lyr, alerta, sequia });
        });

        if (alertLayers.length > 0) {
          let phase = true;
          pulseRef.current = setInterval(() => {
            alertLayers.forEach(({ lyr, alerta, sequia }) => {
              const isCritica  = mode === 'sequias' ? sequia === 'EXTREMA' : alerta === 'CRÍTICA';
              const hiOp = isCritica ? 0.82 : 0.75;
              const loOp = 0.08;
              lyr.setStyle({ fillOpacity: phase ? hiOp : loOp, weight: phase ? 1.8 : 0.6 });
            });
            phase = !phase;
          }, 750);
        }
      }, [data, mode, geoReady]);

      return (
        <div className="map-panel-wrap" style={{position:'relative'}}>
          <div ref={mapDiv} className="map-div" />
          {!geoReady && (
            <div style={{position:'absolute',inset:0,display:'flex',alignItems:'center',
              justifyContent:'center',background:'rgba(10,15,26,0.55)',zIndex:999,
              color:'var(--text-muted)',fontFamily:'DM Mono',fontSize:'11px',letterSpacing:'0.14em',
              pointerEvents:'none'}}>
              CARGANDO POL&Iacute;GONOS&hellip;
            </div>
          )}
          <Legend mode={mode} />
        </div>
      );
    }

    // ─── Cartera Box Section (per-indicator) ─────────────────────────────────

    function CarteraBoxSection({ indicador, alertaLookup, alertTargets, alertLabel, dataFecha }) {
      const [carteraData,   setCarteraData]   = useState(null);
      const [carteraResult, setCarteraResult] = useState(null);
      const [carteraError,  setCarteraError]  = useState(null);
      const fileRef = useRef(null);

      const CONFIGS = {
        lluvias:        { indicador:'lluvias',        title: 'Reporte Cartera – Alerta Lluvias',        indicadorLabel: 'Precipitación / Lluvias',    alertColor: '#e03131', csv: 'cartera_lluvias.csv'        },
        sequias:        { indicador:'sequias',        title: 'Reporte Cartera – Sequía Severa',    indicadorLabel: 'Sequía recurrente (SPI)',    alertColor: '#e8590c', csv: 'cartera_sequias.csv'        },
        deslizamientos: { indicador:'deslizamientos', title: 'Reporte Cartera – Deslizamientos ALTA',   indicadorLabel: 'Movimientos en masa (SGC)',       alertColor: '#2d6b3c', csv: 'cartera_deslizamientos.csv' },
      };
      const cfg = CONFIGS[indicador] ?? CONFIGS.lluvias;

      function handleFile(e) {
        const file = e.target.files[0];
        if (!file) return;
        setCarteraError(null); setCarteraData(null); setCarteraResult(null);
        Papa.parse(file, {
          header: true, skipEmptyLines: true,
          complete: ({ data, errors }) => {
            if (errors.length) console.warn('Cartera warnings:', errors);
            if (!data.length) { setCarteraError('El archivo está vacío.'); return; }
            const keys      = Object.keys(data[0]);
            const codCol    = keys.find(k => /cod/i.test(k) && /mpio|muni/i.test(k)) ?? keys.find(k => /cod/i.test(k)) ?? keys[0];
            const carteraCol = keys.find(k => /cartera/i.test(k));
            const nameCol    = keys.find(k => /nom/i.test(k) && /mpio|muni/i.test(k)) ?? keys.find(k => /nombre|name/i.test(k));
            if (!carteraCol) { setCarteraError('No se encontró columna "cartera_total". Verifique el formato.'); return; }
            let totalCartera = 0, cartaRiesgo = 0, nTotal = 0, nRiesgo = 0;
            const merged = [];
            data.forEach(r => {
              const cod    = (r[codCol] ?? '').toString().trim();
              const val    = parseFloat((r[carteraCol] ?? '').toString().replace(/[^0-9.-]/g,'')) || 0;
              const nombre = nameCol ? (r[nameCol] ?? cod) : cod;
              const alerta = alertaLookup[cod] ?? alertaLookup[cod.padStart(5,'0')] ?? 'Sin datos';
              const enRiesgo = alertTargets.includes(alerta);
              totalCartera += val; nTotal++;
              if (enRiesgo) { cartaRiesgo += val; nRiesgo++; }
              merged.push({ cod, nombre, cartera_total: val, alerta_indicador: alerta, enRiesgo });
            });
            const indicator = totalCartera > 0 ? (cartaRiesgo / totalCartera * 100).toFixed(2) : '0.00';
            setCarteraData(merged);
            setCarteraResult({ totalCartera, cartaRiesgo, indicator, nTotal, nRiesgo });
          },
          error: err => setCarteraError('Error al leer el archivo: ' + err.message),
        });
        e.target.value = '';
      }

      function handleExportCSV() {
        if (!carteraData) return;
        const headers = ['cod','nombre','cartera_total','alerta_indicador'];
        const rows = carteraData.map(r => [r.cod, `"${r.nombre}"`, r.cartera_total, r.alerta_indicador].join(','));
        const csv  = '﻿' + [headers.join(','), ...rows].join('\r\n');
        const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
        const url  = URL.createObjectURL(blob);
        const a    = document.createElement('a');
        a.href = url; a.download = cfg.csv; a.click();
        URL.revokeObjectURL(url);
      }

      const fmtM = v => (v / 1e6).toFixed(1) + ' M';
      const capFirst = s => s.charAt(0).toUpperCase() + s.slice(1);

      return (
        <div className="panel-card">
          <div className="panel-card-title">An&aacute;lisis de Cartera &middot; {capFirst(indicador)}</div>
          <div className="btn-row">
            <button onClick={() => { const a=document.createElement('a'); a.href='data/cartera_municipios_codigos.csv'; a.download='cartera_municipios_codigos.csv'; a.click(); }} className="btn btn-dark">
              &#x1F4CB; Ejemplo
            </button>
            <button onClick={() => fileRef.current?.click()} className="btn btn-primary">
              &#x1F4C2; Cargar cartera
            </button>
            <input ref={fileRef} type="file" accept=".csv,.xlsx,.xls" onChange={handleFile} style={{display:'none'}} />
          </div>
          <p className="hint-text">
            CSV con <code>COD_MPIO</code> y <code>cartera_total</code>. Cruzado con <b>{alertLabel}</b>.
          </p>
          {carteraError && <div className="error-box">&#x26A0; {carteraError}</div>}
          {carteraResult && (
            <div>
              <div className="indicator-box">
                <div className="indicator-value">{carteraResult.indicator}%</div>
                <div className="indicator-label">Cartera en riesgo / Cartera total</div>
              </div>
              <div className="cartera-kpi-grid">
                <div className="cartera-kpi danger">
                  <div className="cartera-kpi-value">{fmtM(carteraResult.cartaRiesgo)} COP</div>
                  <div className="cartera-kpi-label">Cartera en riesgo <span style={{marginLeft:'4px',color:'var(--danger)'}}>({carteraResult.nRiesgo} mpios)</span></div>
                </div>
                <div className="cartera-kpi">
                  <div className="cartera-kpi-value">{fmtM(carteraResult.totalCartera)} COP</div>
                  <div className="cartera-kpi-label">Cartera total <span style={{marginLeft:'4px',color:'var(--accent-gold)'}}>({carteraResult.nTotal} mpios)</span></div>
                </div>
              </div>
              <div style={{display:'flex', gap:'8px'}}>
                <button onClick={() => exportReportePDFSection(carteraResult, carteraData, dataFecha, {...cfg, alertLabel})} className="btn btn-danger" style={{flex:1,justifyContent:'center'}}>
                  &#x1F4C4; Exportar PDF
                </button>
                <button onClick={handleExportCSV} className="btn btn-success" style={{flex:1,justifyContent:'center'}}>
                  &#x1F4BE; Exportar CSV
                </button>
              </div>
            </div>
          )}
        </div>
      );
    }

    function ChartBox({ allData }) {
      const canvasRef = useRef(null);
      const chartRef  = useRef(null);

      useEffect(() => {
        if (!canvasRef.current) return;

        const deptMap = {};
        allData.forEach(d => {
          if (!deptMap[d.NOM_DPTO]) deptMap[d.NOM_DPTO] = { sum: 0, count: 0 };
          deptMap[d.NOM_DPTO].sum   += d.precip_acum_mm;
          deptMap[d.NOM_DPTO].count += 1;
        });
        const sorted = Object.entries(deptMap)
          .map(([name, v]) => ({ name, avg: v.sum / v.count }))
          .sort((a, b) => b.avg - a.avg)
          .slice(0, 10);

        const labels = sorted.map(d => d.name.length > 16 ? d.name.slice(0, 16) + '…' : d.name);
        const values = sorted.map(d => parseFloat(d.avg.toFixed(2)));

        if (chartRef.current) {
          chartRef.current.data.labels           = labels;
          chartRef.current.data.datasets[0].data = values;
          chartRef.current.update();
        } else {
          chartRef.current = new Chart(canvasRef.current, {
            type: 'bar',
            data: {
              labels,
              datasets: [{
                label: 'Precip. promedio (mm)',
                data: values,
                backgroundColor: 'rgba(79,168,155,0.55)',
                borderColor: 'rgba(200,169,110,0.5)',
                borderWidth: 1,
                borderRadius: 2,
              }]
            },
            options: {
              indexAxis: 'y',
              responsive: true,
              maintainAspectRatio: false,
              plugins: {
                legend: { display: false },
              },
              scales: {
                x: {
                  title: { display: true, text: 'mm', font: { size: 10, family: "'DM Mono', monospace" }, color: '#8a9ab0' },
                  ticks: { font: { size: 10, family: "'DM Mono', monospace" }, color: '#8a9ab0' },

                  grid: { color: 'rgba(200,169,110,0.06)' },
                },

          });
        }
      }, [allData]);

      useEffect(() => {
        return () => {
          if (chartRef.current) { chartRef.current.destroy(); chartRef.current = null; }
        };
      }, []);

      return (
        <div className="panel-card">
          <div className="panel-card-title">Top 10 departamentos por precipitaci&oacute;n</div>
          <div style={{height:'230px', position:'relative', background:'transparent'}}>
            <canvas ref={canvasRef} />

        </div>
      );

    // ─── Cartera Analysis Box ─────────────────────────────────────────────────

    function CarteraBox({ alertaHistData, allData, dataFecha }) {
      const [carteraData,   setCarteraData]   = useState(null);
      const [carteraResult, setCarteraResult] = useState(null);
      const [carteraError,  setCarteraError]  = useState(null);
      const fileRef = useRef(null);

      function downloadSample() {
        const a = document.createElement('a');
        a.href = 'data/cartera_municipios_codigos.csv';
        a.download = 'cartera_municipios_codigos.csv';
        a.click();
      }

      function handleFile(e) {
        const file = e.target.files[0];
        if (!file) return;
        setCarteraError(null); setCarteraData(null); setCarteraResult(null);

        Papa.parse(file, {
          header: true,
          skipEmptyLines: true,
          complete: ({ data, errors }) => {
            if (errors.length) console.warn('Cartera CSV warnings:', errors);
            if (!data.length) { setCarteraError('El archivo está vacío.'); return; }

            const firstRow = data[0];
            const keys     = Object.keys(firstRow);
            const codCol    = keys.find(k => /cod/i.test(k) && /mpio|muni/i.test(k)) ?? keys.find(k => /cod/i.test(k)) ?? keys[0];
            const carteraCol = keys.find(k => /cartera/i.test(k));
            const nameCol    = keys.find(k => /nom/i.test(k) && /mpio|muni/i.test(k)) ?? keys.find(k => /nombre|name/i.test(k));

            if (!carteraCol) {
              setCarteraError('No se encontró columna "cartera_total" en el archivo. Verifique el formato.');
              return;
            }

            let totalCartera = 0, cartaAlta = 0, nTotal = 0, nAlta = 0;
            const merged = [];

            data.forEach(r => {
              const cod    = (r[codCol] ?? '').toString().trim();
              const val    = parseFloat((r[carteraCol] ?? '').toString().replace(/[^0-9.-]/g,'')) || 0;
              const nombre = nameCol ? (r[nameCol] ?? cod) : cod;
              const alerta = alertaHistData[cod] ?? alertaHistData[cod.padStart(5,'0')] ?? 'Sin datos';
              totalCartera += val; nTotal++;
              if (alerta === 'ALTA') { cartaAlta += val; nAlta++; }
              merged.push({ cod, nombre, cartera_total: val, alerta_lluvias: alerta, _col: carteraCol });
            });

            const indicator = totalCartera > 0 ? (cartaAlta / totalCartera * 100).toFixed(2) : '0.00';
            setCarteraData(merged);
            setCarteraResult({ totalCartera, cartaAlta, indicator, nTotal, nAlta, carteraCol });
          },
          error: err => setCarteraError('Error al leer el archivo: ' + err.message),
        });
        e.target.value = '';
      }

      function handleExportCSV() {
        if (!carteraData) return;
        const headers = ['cod','nombre','cartera_total','alerta_lluvias'];
        const rows    = carteraData.map(r =>
          [r.cod, `"${r.nombre}"`, r.cartera_total, r.alerta_lluvias].join(',')
        );
        const csv  = '﻿' + [headers.join(','), ...rows].join('\r\n');
        const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
        const url  = URL.createObjectURL(blob);
        const a    = document.createElement('a');
        a.href = url; a.download = 'cartera_alerta_lluvias.csv'; a.click();
        URL.revokeObjectURL(url);
      }

      const fmtM = v => (v / 1e6).toFixed(1) + ' M';

      return (
        <div className="panel-card">
          <div className="panel-card-title">An&aacute;lisis de Cartera</div>

          <div className="btn-row">
            <button onClick={downloadSample} className="btn btn-dark">
              &#x1F4CB; Archivo de ejemplo
            </button>
            <button onClick={() => fileRef.current?.click()} className="btn btn-primary">
              &#x1F4C2; Cargar cartera
            </button>
            <input ref={fileRef} type="file" accept=".csv,.xlsx,.xls" onChange={handleFile} style={{display:'none'}} />
          </div>

          <p className="hint-text">
            Cargue un CSV con columnas <code>COD_MPIO</code> y <code>cartera_total</code>.
            Se cruza con la alerta hist&oacute;rica de lluvias.
          </p>

          {carteraError && (
            <div className="error-box">&#x26A0; {carteraError}</div>
          )}

          {carteraResult && (
            <div>
              <div className="indicator-box">
                <div className="indicator-value">{carteraResult.indicator}%</div>
                <div className="indicator-label">Cartera en alerta ALTA / Cartera total</div>
              </div>

              <div className="cartera-kpi-grid">
                <div className="cartera-kpi danger">
                  <div className="cartera-kpi-value">{fmtM(carteraResult.cartaAlta)} COP</div>
                  <div className="cartera-kpi-label">
                    Cartera en alerta ALTA
                    <span style={{marginLeft:'4px', color:'var(--danger)'}}>({carteraResult.nAlta} mpios)</span>
                  </div>
                </div>
                <div className="cartera-kpi">
                  <div className="cartera-kpi-value">{fmtM(carteraResult.totalCartera)} COP</div>
                  <div className="cartera-kpi-label">
                    Cartera total
                    <span style={{marginLeft:'4px', color:'var(--accent-gold)'}}>({carteraResult.nTotal} mpios)</span>
                  </div>
                </div>
              </div>

              <div style={{display:'flex', gap:'8px'}}>
                <button
                  onClick={() => exportReportePDF(carteraResult, carteraData, dataFecha)}
                  className="btn btn-danger"
                  style={{flex:1, justifyContent:'center'}}
                >
                  &#x1F4C4; Exportar PDF
                </button>
                <button
                  onClick={handleExportCSV}
                  className="btn btn-success"
                  style={{flex:1, justifyContent:'center'}}
                >
                  &#x1F4BE; Exportar CSV
                </button>
              </div>
            </div>
          )}
        </div>
      );
    }

    function IncendiosMap({ data, visible }) {
      const mapDiv     = useRef(null);
      const leafletMap = useRef(null);
      const markersRef = useRef(null);

      useEffect(() => {
        if (!visible || !mapDiv.current) return;
        if (!leafletMap.current) {
          leafletMap.current = L.map(mapDiv.current, { zoomControl: true }).setView([4.5, -74], 5);
          L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; CARTO', maxZoom: 18
          }).addTo(leafletMap.current);
        } else {
          leafletMap.current.invalidateSize();
          if (markersRef.current) { markersRef.current.clearLayers(); }
        }

        const group = L.layerGroup();
        data.forEach(pt => {
          const lat = parseFloat(pt.lat), lon = parseFloat(pt.lon);
          if (isNaN(lat) || isNaN(lon)) return;
          const color = CONF_COLOR[pt.confianza] || '#e67e22';
          const marker = L.circleMarker([lat, lon], {
            radius: pt.confianza === 'Alta' ? 7 : 5,
            color: '#fff', weight: 0.5,
            fillColor: color, fillOpacity: 0.85,
          });
          const mpio = pt.municipio && pt.municipio !== '' ? pt.municipio : null;
          const dpto = pt.departamento && pt.departamento !== '' ? pt.departamento : null;
          marker.bindPopup(
            `${mpio ? `<div style="font-weight:700;font-size:13px;margin-bottom:4px">${mpio}${dpto ? `, ${dpto}` : ''}</div>` : ''}` +
            `<b>${pt.fuente}</b><br>` +
            `Confianza: <b style="color:${CONF_COLOR[pt.confianza]||'#e67e22'}">${pt.confianza}</b><br>` +
            `Temp: ${pt.temp_c ? pt.temp_c + ' &deg;C' : 'N/D'}<br>` +
            `Captura: ${pt.captura === 'D' ? 'D\u00eda' : pt.captura === 'N' ? 'Noche' : pt.captura}<br>` +
            `<span style="color:#aaa;font-size:11px">${pt.fecha_hora}</span>`
          );
          group.addLayer(marker);
        });
        group.addTo(leafletMap.current);
        markersRef.current = group;
      }, [visible, data]);

    function IncendiosCheckerPanel({ data }) {
      const [lat, setLat] = React.useState('');
      const [lon, setLon] = React.useState('');
      const [result, setResult] = React.useState(null);

      function haversineKm(lat1, lon1, lat2, lon2) {
        const R = 6371, toRad = x => x * Math.PI / 180;
        const dLat = toRad(lat2 - lat1), dLon = toRad(lon2 - lon1);
        const a = Math.sin(dLat/2)**2 + Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLon/2)**2;
        return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
      }

      function checkCoords() {
        const la = parseFloat(lat), lo = parseFloat(lon);
        if (isNaN(la) || isNaN(lo)) { setResult({ error: true }); return; }
        let nearest = null, minDist = Infinity;
        data.forEach(pt => {
          const d = haversineKm(la, lo, parseFloat(pt.lat), parseFloat(pt.lon));
          if (d < minDist) { minDist = d; nearest = pt; }
        });
        setResult({ dist: minDist, nearest, la, lo });
      }

      const RADIO_KM = 25;
      return (
        <div style={{background:'#1a2a3a', borderRadius:'10px', padding:'20px', maxWidth:'520px'}}>
          <div style={{fontWeight:700, fontSize:'15px', color:'#fff', marginBottom:'14px'}}>
            Verificar coordenadas del proyecto
          </div>
          <div style={{display:'flex', gap:'10px', marginBottom:'12px'}}>
            <input value={lat} onChange={e=>setLat(e.target.value)} placeholder="Latitud (ej: 4.5)"
              style={{flex:1, padding:'8px 10px', borderRadius:'6px', border:'1px solid #334',
                background:'#0d1b2a', color:'#fff', fontSize:'13px'}} />
            <input value={lon} onChange={e=>setLon(e.target.value)} placeholder="Longitud (ej: -74.0)"
              style={{flex:1, padding:'8px 10px', borderRadius:'6px', border:'1px solid #334',
                background:'#0d1b2a', color:'#fff', fontSize:'13px'}} />
            <button onClick={checkCoords}
              style={{padding:'8px 16px', background:'#c0392b', color:'#fff', border:'none',
                borderRadius:'6px', cursor:'pointer', fontWeight:600, fontSize:'13px'}}>
              Verificar
            </button>
          </div>
          {result && !result.error && (
            <div style={{
              background: result.dist <= RADIO_KM ? '#3b1010' : '#0f2b0f',
              border: `1px solid ${result.dist <= RADIO_KM ? '#e74c3c' : '#2ecc71'}`,
              borderRadius:'8px', padding:'14px', color:'#fff', fontSize:'13px'
            }}>
              {result.dist <= RADIO_KM ? (
                <>
                  <div style={{color:'#e74c3c', fontWeight:700, fontSize:'15px', marginBottom:'8px'}}>
                    &#x26A0; Punto de calor cercano ({result.dist.toFixed(1)} km)
                  </div>
                  {result.nearest.municipio && result.nearest.municipio !== '' && (
                    <div style={{fontWeight:700, fontSize:'14px', marginBottom:'6px', color:'#ffd'}}>
                      {result.nearest.municipio}{result.nearest.departamento ? `, ${result.nearest.departamento}` : ''}
                    </div>
                  )}
                  <div>Fuente: <b>{result.nearest.fuente}</b></div>
                  <div>Confianza: <b style={{color: CONF_COLOR[result.nearest.confianza]}}>{result.nearest.confianza}</b></div>
                  <div>Temp: {result.nearest.temp_c ? result.nearest.temp_c + ' \u00b0C' : 'N/D'}</div>
                  <div>Fecha/hora: {result.nearest.fecha_hora}</div>
                  <div style={{color:'#aab', fontSize:'11px', marginTop:'6px'}}>Coordenadas: {parseFloat(result.nearest.lat).toFixed(4)}, {parseFloat(result.nearest.lon).toFixed(4)}</div>
                </>
              ) : (
                <div style={{color:'#2ecc71', fontWeight:600}}>
                  Sin puntos de calor en radio de {RADIO_KM} km &mdash; m\u00e1s cercano a {result.dist.toFixed(1)} km
                </div>
              )}
            </div>
          )}
          {result && result.error && (
            <div style={{color:'#e74c3c', fontSize:'13px'}}>Ingresa coordenadas válidas.</div>
          )}
        </div>
      );
    }

    // ─── Áreas Protegidas Map Panel ───────────────────────────────────────────

    function AreasProtegidasMapPanel({ apData, ecoData, activeLayers, visible = true }) {
      const mapDiv       = useRef(null);
      const leafletMap   = useRef(null);
      const muniGroup    = useRef(null);
      const ecoGroups    = useRef({});
      const initialized  = useRef(false);

      // Init map once
      useEffect(() => {
        if (initialized.current) return;
        initialized.current = true;
        const map = L.map(mapDiv.current, { center: [4.5, -74.0], zoom: 5, preferCanvas: true });
        L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
          attribution: '&copy; OpenStreetMap &copy; CARTO', maxZoom: 19,
        }).addTo(map);
        map.fitBounds([[1, -79], [13, -67]]);
        muniGroup.current = L.layerGroup().addTo(map);
        // Create one LayerGroup per ecosystem layer (all initially hidden)
        ECOS_LAYERS.forEach(ec => {
          ecoGroups.current[ec.key] = L.layerGroup();
        });
        leafletMap.current = map;
      }, []);

      // Resize on visibility
      useEffect(() => {
        if (visible && leafletMap.current) {
          setTimeout(() => { leafletMap.current.invalidateSize(); leafletMap.current.fitBounds([[1,-79],[13,-67]]); }, 80);
        }
      }, [visible]);

      // Toggle esri-leaflet feature layers based on activeLayers
      useEffect(() => {
        if (!leafletMap.current) return;
        ECOS_LAYERS.forEach(ec => {
          const grp = ecoGroups.current[ec.key];
          if (!grp) return;
          const isOn = activeLayers[ec.key];
          if (isOn) {
            if (!leafletMap.current.hasLayer(grp)) {
              // Load from ArcGIS FeatureServer if not yet populated
              if (grp.getLayers().length === 0) {
                const fl = L.esri.featureLayer({
                  url: ec.url,
                  style: () => ec.style,
                  onEachFeature: (feature, layer) => {
                    const p = feature.properties || {};
                    const name = p.uab_nombre_area_protegida || p.nombre || p.uab_nombre_reserva || p.nombre_cap || p.nomah || p.region || '';
                    const area = p.area_ha ? `${parseFloat(p.area_ha).toLocaleString('es-CO',{maximumFractionDigits:0})} ha` : '';
                    layer.bindPopup(`<div style="font-family:'Lora',serif;font-size:13px;color:#1a1a1a;min-width:180px;">
                      <div style="font-weight:700;color:${ec.dotColor};margin-bottom:3px;">${ec.label}</div>
                      ${name ? `<div style="font-size:12px;">${name}</div>` : ''}
                      ${area  ? `<div style="font-size:11px;color:#555;">&#x1F4CF; ${area}</div>` : ''}
                    </div>`, { maxWidth: 240 });
                  }
                });
                fl.addTo(grp);
              }
              grp.addTo(leafletMap.current);
            }
          } else {
            if (leafletMap.current.hasLayer(grp)) leafletMap.current.removeLayer(grp);
          }
        });
      }, [activeLayers]);

      // Redraw municipal dots
      useEffect(() => {
        if (!muniGroup.current) return;
        muniGroup.current.clearLayers();
        apData.filter(d => !isNaN(parseFloat(d.LATITUD)) && !isNaN(parseFloat(d.LONGITUD))).forEach(d => {
          // Determine active ecosystems for this municipality
          const hits = ECOS_LAYERS.filter(ec => parseInt(d[ec.csvKey]) === 1);
          const hasAny = hits.length > 0;
          const mainColor = hits.length > 0 ? hits[0].dotColor : '#546e7a';
          const radius = hasAny ? 8 : 5;

          const ecosHTML = hits.length > 0
            ? hits.map(ec => `<span style="display:inline-block;background:${ec.color};color:#fff;font-size:10px;padding:1px 5px;border-radius:2px;margin:1px;">${ec.label}</span>`).join('')
            : '<span style="color:#78909c;font-size:11px;">Sin ecosistemas registrados</span>';

          const m = L.circleMarker([parseFloat(d.LATITUD), parseFloat(d.LONGITUD)], {
            radius,
            color: hasAny ? mainColor : 'rgba(255,255,255,0.15)',
            weight: hasAny ? 1.5 : 0.5,
            fillColor: mainColor,
            fillOpacity: hasAny ? 0.85 : 0.35,
          });
          m.bindPopup(`
            <div style="font-family:'Lora',serif;font-size:13px;min-width:200px;color:#f5f0e8;">
              <div style="color:#c8a96e;font-size:14px;font-weight:700;margin-bottom:2px;">${d.NOM_MPIO}</div>
              <div style="color:#8a9ab0;font-size:12px;margin-bottom:8px;">${d.NOM_DPTO}</div>
              <div>${ecosHTML}</div>
            </div>`, { maxWidth: 280 });
          m.addTo(muniGroup.current);
        });
      }, [apData]);

      return <div className="map-panel-wrap"><div ref={mapDiv} className="map-div" /></div>;
    }

    // ─── Áreas Protegidas Table ───────────────────────────────────────────────
