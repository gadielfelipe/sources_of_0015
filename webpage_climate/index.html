<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Circular 0015 indicadores</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><circle cx='32' cy='32' r='32' fill='%230a0f1a'/><path d='M12 44 Q20 20 32 28 Q44 36 52 12' stroke='%23c8a96e' stroke-width='4' fill='none' stroke-linecap='round'/><path d='M22 52 Q26 30 32 36 Q38 42 44 24' stroke='%234fa89b' stroke-width='2.5' fill='none' stroke-linecap='round'/></svg>">

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

  <!-- Google Fonts: Cinematic Earth Intelligence -->
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Lora:ital,wght@0,400;0,500;1,400&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-primary:    #0a0f1a;
      --bg-secondary:  #0d1a12;
      --bg-card:       #111827;
      --bg-card-hover: #1a2535;
      --accent-gold:   #c8a96e;
      --accent-teal:   #4fa89b;
      --text-primary:  #f5f0e8;
      --text-muted:    #8a9ab0;
      --danger:        #c0392b;
      --warning:       #e67e22;
      --border:        rgba(200,169,110,0.15);
      --border-strong: rgba(200,169,110,0.35);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      background: var(--bg-primary);
      color: var(--text-primary);
      font-family: 'Lora', Georgia, serif;
      min-height: 100vh;
    }

    /* ── Scrollbar ─────────────────────────────────────── */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg-primary); }
    ::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--accent-gold); }

    /* ── Video Hero ─────────────────────────────────────── */
    .hero-section {
      position: relative;
      height: 100vh;
      min-height: 600px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .hero-video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 0;
    }
    .hero-overlay {
      position: absolute;
      inset: 0;
      background: rgba(6, 10, 18, 0.72);
      z-index: 1;
    }
    /* Hide any watermark burned into the video */
    .hero-video { filter: brightness(0.72) saturate(0.85); }

    .hero-content {
      position: relative;
      z-index: 2;
      text-align: center;
      padding: 0 32px;
      max-width: 780px;
      opacity: 0;
      animation: heroFadeIn 2.4s cubic-bezier(0.16,1,0.3,1) 0.3s forwards;
    }
    @keyframes heroFadeIn {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .hero-eyebrow {
      font-family: 'DM Mono', monospace;
      font-size: 10px;
      letter-spacing: 0.32em;
      color: var(--accent-gold);
      text-transform: uppercase;
      margin-bottom: 28px;
      opacity: 0.85;
    }
    .hero-title {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-weight: 300;
      font-size: clamp(22px, 3.2vw, 44px);
      color: rgba(245,240,232,0.70);
      line-height: 1.2;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      margin-bottom: 10px;
    }
    .hero-title-main {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-weight: 600;
      font-size: clamp(64px, 12vw, 130px);
      color: #ffffff;
      line-height: 0.92;
      letter-spacing: -0.02em;
      display: block;
      margin-bottom: 18px;
    }
    .hero-rule {
      width: 40px;
      height: 1px;
      background: var(--accent-gold);
      opacity: 0.55;
      margin: 28px auto;
    }
    .hero-desc {
      font-family: 'Lora', serif;
      font-size: clamp(13px, 1.5vw, 15px);
      color: rgba(245,240,232,0.72);
      line-height: 1.7;
      max-width: 600px;
      margin: 0 auto 28px;
    }
    .hero-sub {
      font-family: 'DM Mono', monospace;
      font-size: 10px;
      letter-spacing: 0.22em;
      color: rgba(138,154,176,0.75);
      text-transform: uppercase;
    }
    .hero-corner {
      position: absolute;
      width: 22px; height: 22px;
      z-index: 2;
      opacity: 0.45;
    }
    .hero-corner.tl { top: 28px; left: 28px; border-top: 1px solid var(--accent-gold); border-left: 1px solid var(--accent-gold); }
    .hero-corner.tr { top: 28px; right: 28px; border-top: 1px solid var(--accent-gold); border-right: 1px solid var(--accent-gold); }
    .hero-corner.bl { bottom: 28px; left: 28px; border-bottom: 1px solid var(--accent-gold); border-left: 1px solid var(--accent-gold); }
    .hero-corner.br { bottom: 28px; right: 28px; border-bottom: 1px solid var(--accent-gold); border-right: 1px solid var(--accent-gold); }
    .hero-scroll {
      position: absolute;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      z-index: 2;
      text-decoration: none;
    }
    .hero-scroll-label {
      font-family: 'DM Mono', monospace;
      font-size: 9px;
      letter-spacing: 0.28em;
      color: rgba(200,169,110,0.55);
      text-transform: uppercase;
    }
    .hero-scroll-line {
      width: 1px;
      height: 40px;
      background: linear-gradient(to bottom, rgba(200,169,110,0.6), transparent);
      animation: scrollLine 2s ease-in-out infinite;
    }
    @keyframes scrollLine {
      0%   { transform: scaleY(0); transform-origin: top; opacity: 0; }
      40%  { transform: scaleY(1); transform-origin: top; opacity: 1; }
      100% { transform: scaleY(1); transform-origin: top; opacity: 0; }
    }

    /* ── Navbar ─────────────────────────────────────────── */
    .navbar {
      position: sticky;
      top: 0;
      z-index: 900;
      padding: 12px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: background 0.35s ease, box-shadow 0.35s ease;
      background: transparent;
    }
    .navbar.scrolled {
      background: rgba(10,15,26,0.96);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      box-shadow: 0 1px 0 var(--border);
    }
    .navbar-logo { display: flex; align-items: center; gap: 14px; }
    .navbar-logo img { height: 42px; object-fit: contain; }
    .navbar-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 15px;
      font-weight: 600;
      color: var(--text-primary);
      line-height: 1.2;
    }
    .navbar-subtitle {
      font-family: 'DM Mono', monospace;
      font-size: 10px;
      color: var(--text-muted);
      letter-spacing: 0.06em;
      margin-top: 3px;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .navbar-date-badge {
      font-family: 'DM Mono', monospace;
      font-size: 10px;
      letter-spacing: 0.08em;
      color: var(--accent-gold);
      border: 1px solid var(--border-strong);
      padding: 3px 9px;
      border-radius: 2px;
      background: rgba(200,169,110,0.07);
    }
    .navbar-source {
      font-family: 'DM Mono', monospace;
      font-size: 10px;
      color: var(--text-muted);
      letter-spacing: 0.06em;
    }
    @media (max-width: 640px) { .navbar-source { display: none; } }

    /* ── Dashboard ──────────────────────────────────────── */
    #dashboard { background: var(--bg-primary); min-height: 100vh; }
    .dashboard-main { padding: 24px 20px; }

    /* ── KPI Grid ───────────────────────────────────────── */
    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
      margin-bottom: 22px;
    }
    @media (min-width: 1024px) { .kpi-grid { grid-template-columns: repeat(4, 1fr); } }
    .kpi-card {
      background: var(--bg-card);
      border-radius: 2px;
      padding: 18px 16px;
      border-left: 3px solid var(--accent-teal);
      border-top: 1px solid var(--border);
      border-right: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      transition: transform 0.22s ease, box-shadow 0.22s ease;
      cursor: default;
    }
    .kpi-card:hover { transform: translateY(-3px); box-shadow: 0 8px 32px rgba(0,0,0,0.5); }
    .kpi-card.accent-red   { border-left-color: var(--danger); }
    .kpi-card.accent-gold  { border-left-color: var(--accent-gold); }
    .kpi-card.accent-green { border-left-color: var(--accent-teal); }
    .kpi-icon { font-size: 20px; margin-bottom: 10px; }
    .kpi-value {
      font-family: 'DM Mono', monospace;
      font-size: 28px;
      font-weight: 500;
      color: var(--accent-gold);
      line-height: 1;
      margin-bottom: 6px;
    }
    .kpi-label {
      font-family: 'Lora', serif;
      font-size: 11px;
      color: var(--text-muted);
    }
    .kpi-sub {
      font-family: 'DM Mono', monospace;
      font-size: 10px;
      color: var(--text-muted);
      margin-top: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* ── Map layout ─────────────────────────────────────── */
    .map-layout {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    @media (min-width: 1024px) {
      .map-layout { flex-direction: row; }
      .map-main { width: 65%; }
      .map-side { width: 35%; }
    }
    .map-div { height: 520px; }
    @media (max-width: 768px) { .map-div { height: 340px; } }
    .map-panel-wrap {
      background: var(--bg-card);
      border-radius: 2px;
      border: 1px solid var(--border);
      overflow: hidden;
      position: relative;
    }

    /* ── Tab bar ─────────────────────────────────────────── */
    .tab-bar { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
    .tab-btn {
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      letter-spacing: 0.06em;
      padding: 8px 16px;
      border-radius: 2px;
      border: 1px solid var(--border-strong);
      background: var(--bg-card);
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .tab-btn:hover { color: var(--text-primary); border-color: var(--accent-gold); }
    .tab-btn.active-lluvias { background: rgba(79,168,155,0.15); color: var(--accent-teal); border-color: var(--accent-teal); }
    .tab-btn.active-sequias { background: rgba(230,126,34,0.15); color: var(--warning); border-color: var(--warning); }
    .tab-btn.active-desliz  { background: rgba(200,169,110,0.12); color: var(--accent-gold); border-color: var(--accent-gold); }

    /* ── Legend ─────────────────────────────────────────── */
    .map-legend {
      position: absolute;
      bottom: 28px;
      left: 10px;
      z-index: 1000;
      background: rgba(10,15,26,0.90);
      border: 1px solid var(--border);
      border-radius: 2px;
      padding: 12px 14px;
      pointer-events: none;
      backdrop-filter: blur(8px);
    }
    .legend-title {
      font-family: 'DM Mono', monospace;
      font-size: 9px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--accent-gold);
      margin-bottom: 8px;
    }
    .legend-item { display: flex; align-items: center; gap: 7px; margin-bottom: 4px; }
    .legend-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
    .legend-label { color: var(--text-muted); font-family: 'DM Mono', monospace; font-size: 10px; }
    .legend-divider { border: none; border-top: 1px solid var(--border); margin: 6px 0; }

    /* ── Side panel ─────────────────────────────────────── */
    .side-panel { display: flex; flex-direction: column; gap: 14px; }
    .panel-card {
      background: var(--bg-card);
      border-radius: 2px;
      border: 1px solid var(--border);
      padding: 18px;
    }
    .panel-card-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 15px;
      font-weight: 600;
      color: var(--accent-gold);
      letter-spacing: 0.04em;
      margin-bottom: 14px;
    }

    /* ── Form controls ──────────────────────────────────── */
    .form-label {
      font-family: 'DM Mono', monospace;
      font-size: 9px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--text-muted);
      display: block;
      margin-bottom: 6px;
    }
    .form-select {
      width: 100%;
      background: var(--bg-primary);
      border: 1px solid var(--border-strong);
      border-radius: 2px;
      padding: 9px 12px;
      font-family: 'Lora', serif;
      font-size: 13px;
      color: var(--text-primary);
      outline: none;
      cursor: pointer;
      appearance: none;
      -webkit-appearance: none;
    }
    .form-select:focus { border-color: var(--accent-gold); }
    .form-select option { background: var(--bg-card); color: var(--text-primary); }
    .form-checkbox-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 14px;
      cursor: pointer;
    }
    .form-checkbox { width: 15px; height: 15px; accent-color: var(--danger); cursor: pointer; }
    .form-checkbox-label { font-family: 'Lora', serif; font-size: 13px; color: var(--text-primary); }

    /* ── Buttons ─────────────────────────────────────────── */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-family: 'DM Mono', monospace;
      font-size: 10px;
      letter-spacing: 0.10em;
      text-transform: uppercase;
      padding: 8px 14px;
      border-radius: 2px;
      border: 1px solid transparent;
      cursor: pointer;
      transition: all 0.2s ease;
      background: none;
    }
    .btn-primary { background: rgba(200,169,110,0.10); border-color: var(--border-strong); color: var(--accent-gold); }
    .btn-primary:hover { background: rgba(200,169,110,0.20); }
    .btn-danger { background: rgba(192,57,43,0.12); border-color: rgba(192,57,43,0.38); color: var(--danger); }
    .btn-danger:hover { background: rgba(192,57,43,0.25); }
    .btn-success { background: rgba(79,168,155,0.12); border-color: rgba(79,168,155,0.35); color: var(--accent-teal); }
    .btn-success:hover { background: rgba(79,168,155,0.24); }
    .btn-dark { background: rgba(138,154,176,0.08); border-color: var(--border); color: var(--text-muted); }
    .btn-dark:hover { color: var(--text-primary); border-color: var(--border-strong); }
    .btn-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }

    /* ── Stats box ──────────────────────────────────────── */
    .stats-box {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 2px;
      padding: 12px 18px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .stats-count { font-family: 'DM Mono', monospace; font-size: 20px; font-weight: 500; color: var(--accent-gold); }
    .stats-label { font-family: 'Lora', serif; font-size: 13px; color: var(--text-muted); }

    /* ── Table ──────────────────────────────────────────── */
    .table-scroll { max-height: 260px; overflow-y: auto; }
    .data-table { width: 100%; border-collapse: collapse; }
    .data-table th {
      font-family: 'DM Mono', monospace;
      font-size: 9px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--accent-gold);
      padding: 8px 8px;
      text-align: left;
      position: sticky;
      top: 0;
      background: var(--bg-card);
      border-bottom: 1px solid var(--border);
    }
    .data-table th.right { text-align: right; }
    .data-table th.center { text-align: center; }
    .data-table td {
      padding: 7px 8px;
      border-bottom: 1px solid rgba(200,169,110,0.06);
      color: var(--text-primary);
      font-family: 'Lora', serif;
      font-size: 12px;
    }
    .data-table tr:hover td { background: rgba(200,169,110,0.04); }
    .td-right { text-align: right; font-family: 'DM Mono', monospace; color: var(--accent-gold); }
    .td-center { text-align: center; }
    .td-muted { color: var(--text-muted); font-size: 11px; }
    @media (max-width: 640px) { .hide-sm { display: none; } }

    /* ── Cartera ────────────────────────────────────────── */
    .indicator-box {
      background: rgba(200,169,110,0.07);
      border: 1px solid var(--border-strong);
      border-radius: 2px;
      padding: 18px;
      text-align: center;
      margin-bottom: 14px;
    }
    .indicator-value { font-family: 'DM Mono', monospace; font-size: 34px; font-weight: 500; color: var(--accent-gold); }
    .indicator-label { font-family: 'Lora', serif; font-size: 11px; color: var(--text-muted); margin-top: 4px; }
    .cartera-kpi-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
    .cartera-kpi {
      background: var(--bg-primary);
      border: 1px solid var(--border);
      border-radius: 2px;
      padding: 12px;
    }
    .cartera-kpi.danger { border-color: rgba(192,57,43,0.35); }
    .cartera-kpi-value { font-family: 'DM Mono', monospace; font-size: 14px; font-weight: 500; color: var(--accent-gold); }
    .cartera-kpi.danger .cartera-kpi-value { color: var(--danger); }
    .cartera-kpi-label { font-family: 'Lora', serif; font-size: 10px; color: var(--text-muted); margin-top: 4px; }
    .error-box {
      background: rgba(192,57,43,0.10);
      border: 1px solid rgba(192,57,43,0.30);
      border-radius: 2px;
      padding: 10px 14px;
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      color: var(--danger);
      margin-bottom: 10px;
    }
    .hint-text { font-family: 'Lora', serif; font-size: 11px; color: var(--text-muted); line-height: 1.55; margin-bottom: 12px; }
    code {
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      background: rgba(200,169,110,0.08);
      padding: 2px 5px;
      border-radius: 2px;
      color: var(--accent-gold);
    }

    /* ── Scroll reveal ──────────────────────────────────── */
    .reveal { opacity: 0; transform: translateY(22px); transition: opacity 0.7s ease, transform 0.7s ease; }
    .reveal.visible { opacity: 1; transform: translateY(0); }

    /* ── Pulse animations ───────────────────────────────── */
    @keyframes pulse-ring {
      0%   { transform: scale(1);   opacity: 0.9; }
      70%  { transform: scale(2.4); opacity: 0;   }
      100% { transform: scale(2.4); opacity: 0;   }
    }
    .alert-pulse { animation: pulse-ring 1.8s ease-out infinite; border-radius: 50%; border: 2px solid #e03131; position: absolute; pointer-events: none; }
    .sequia-pulse { animation: pulse-ring 1.8s ease-out infinite; animation-delay: -0.9s; border-radius: 50%; border: 2.5px solid #7a4419; position: absolute; pointer-events: none; }
    .sequia-alert-pulse { animation: pulse-ring 1.8s ease-out infinite; animation-delay: -0.45s; border-radius: 50%; border: 2.5px solid #f0b429; position: absolute; pointer-events: none; }

    /* ── Loading / Error ────────────────────────────────── */
    .loading-screen { min-height: 100vh; background: var(--bg-primary); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; }
    .loading-spinner { width: 44px; height: 44px; border: 2px solid var(--border); border-top-color: var(--accent-gold); border-radius: 50%; animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-label { font-family: 'DM Mono', monospace; font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--text-muted); }
    .error-screen { min-height: 100vh; background: var(--bg-primary); display: flex; align-items: center; justify-content: center; }
    .error-card { background: var(--bg-card); border: 1px solid rgba(192,57,43,0.35); border-radius: 2px; padding: 40px 48px; max-width: 480px; text-align: center; }
    .error-icon { font-size: 36px; margin-bottom: 16px; }
    .error-title { font-family: 'Cormorant Garamond', serif; font-size: 22px; color: var(--danger); margin-bottom: 10px; }
    .error-message { font-family: 'Lora', serif; font-size: 13px; color: var(--text-muted); }

    /* ── Footer ─────────────────────────────────────────── */
    .site-footer {
      background: var(--bg-card);
      border-top: 1px solid var(--border);
      padding: 32px 24px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      flex-wrap: wrap;
      gap: 24px;
      margin-top: 48px;
    }
    .footer-brand { font-family: 'Cormorant Garamond', serif; font-size: 17px; font-weight: 600; color: var(--accent-gold); }
    .footer-sub { font-family: 'DM Mono', monospace; font-size: 9px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--text-muted); margin-top: 5px; }
    .footer-sources { font-family: 'Lora', serif; font-size: 11px; color: var(--text-muted); text-align: right; }
    .footer-sources strong { color: var(--text-primary); font-weight: 500; }
    .footer-sources div { margin-top: 5px; }

    /* ── Overview Dashboard ─────────────────────────────────────────────── */
    .overview-kpi-strip {
      background: #fff;
      border-bottom: 1px solid #e0ded8;
      padding: 0 24px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
    }
    @media (max-width: 900px) { .overview-kpi-strip { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 480px) { .overview-kpi-strip { grid-template-columns: 1fr; } }

<body>
  <div id="root"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

  <script src="https://unpkg.com/react@18.2.0/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.23.5/babel.min.js"></script>

  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo } = React;

    // ─── Constants ────────────────────────────────────────────────────────────

    const CATEGORIA_COLORS = {
      'Sin lluvia (0 mm)':   '#adb5bd',
      'Muy ligera (< 5 mm)': '#74c0fc',
      'Ligera (5\u201315 mm)':    '#339af0',
      'Moderada (15\u201330 mm)': '#f0b429',
      'Fuerte (30\u201360 mm)':   '#e03131',
      'Extrema (\u2265 100 mm)':  '#7b0000',
    };

    const LEGEND_ENTRIES = [
      { label: 'Sin lluvia (0 mm)',    color: '#adb5bd' },
      { label: 'Muy ligera (< 5 mm)',  color: '#74c0fc' },
      { label: 'Ligera (5\u201315 mm)',     color: '#339af0' },
      { label: 'Moderada (15\u201330 mm)',  color: '#f0b429' },
      { label: 'Fuerte (30\u201360 mm)',    color: '#e03131' },
      { label: 'Extrema (\u2265 100 mm)',   color: '#7b0000' },
    ];

    const SEQUIA_COLORS = {
      'NORMAL':   '#adb5bd',
      'LEVE':     '#ffe066',
      'MODERADA': '#f0b429',
      'SEVERA':   '#e8590c',
      'EXTREMA':  '#7b0000',
    };

    const SEQUIA_LEGEND_ENTRIES = [
      { label: 'Normal',   color: '#adb5bd' },
      { label: 'Leve',     color: '#ffe066' },
      { label: 'Moderada', color: '#f0b429' },
      { label: 'Severa',   color: '#e8590c' },
      { label: 'Extrema',  color: '#7b0000' },
    ];

    const AMENAZA_MM_COLORS = {
      'MUY_BAJA': '#218a21',
      'BAJA':     '#90ee90',
      'MEDIA':    '#ffd900',
      'ALTA':     '#ff800d',
      'MUY_ALTA': '#d91919',
      '':         '#adb5bd',
    };

    const DESLIZ_LEGEND_ENTRIES = [
      { label: 'Muy baja', color: '#218a21' },
      { label: 'Baja',     color: '#90ee90' },
      { label: 'Media',    color: '#ffd900' },
      { label: 'Alta',     color: '#ff800d' },
      { label: 'Muy alta', color: '#d91919' },
    ];

    // ─── Helpers ──────────────────────────────────────────────────────────────

    function precipCategoria(mm) {
      if (mm <= 0)  return 'Sin lluvia (0 mm)';
      if (mm <  5)  return 'Muy ligera (< 5 mm)';
      if (mm < 15)  return 'Ligera (5\u201315 mm)';
      if (mm < 30)  return 'Moderada (15\u201330 mm)';
      if (mm < 60)  return 'Fuerte (30\u201360 mm)';
      return 'Extrema (\u2265 100 mm)';
    }

    function precipTamano(mm) {
      return Math.max(5, Math.min(Math.sqrt(mm + 1) * 2.8 + 4, 22));
    }

    const ALERTA_NIVEL = { 'BAJA': 0, 'MODERADA': 1, 'ALTA': 2, 'CR\u00cdTICA': 3 };

    function parseRows(raw) {
      return raw.map(r => {
        const cod                  = r['COD_MPIO'] ?? r['\uFEFFCOD_MPIO'] ?? '';
        const mm                   = parseFloat(r.precip_acum_mm) || 0;
        const alerta_compuesta_raw = (r.alerta_compuesta ?? 'BAJA').trim();
        const afectado             = parseInt(r.municipio_afectado) || 0;
        const alerta_compuesta     = afectado === 1 ? alerta_compuesta_raw : 'BAJA';
        const alert                = ALERTA_NIVEL[alerta_compuesta] ?? 0;
        return {
          COD_MPIO:            String(cod),
          NOM_MPIO:            (r.NOM_MPIO         ?? '').trim(),
          NOM_DPTO:            (r.NOM_DPTO         ?? '').trim(),
          LATITUD:             parseFloat(r.LATITUD),
          LONGITUD:            parseFloat(r.LONGITUD),
          precip_acum_mm:      mm,
          precip_max_10min:    parseFloat(r.precip_max_10min)    || 0,
          n_estaciones:        parseInt(r.n_estaciones, 10)      || 0,
          alerta:              alert,
          alerta_compuesta,
          alerta_compuesta_raw,
          frecuencia_extremos: parseFloat(r.frecuencia_extremos) || 0,
          frecuencia_reciente: parseFloat(r.frecuencia_reciente) || 0,
          ratio_reciente:      parseFloat(r.ratio_reciente)      || 0,
          tendencia:           (r.tendencia         ?? 'sin_datos').trim(),
          fecha:               (r.fecha             ?? '').trim(),
          sequia_categoria:    (r.sequia_categoria   ?? 'NORMAL').trim(),
          categoria:           r.categoria ? r.categoria.trim() : precipCategoria(mm),
          tamano:              parseFloat(r['tama\u00f1o']) || precipTamano(mm),
          municipio_afectado:  afectado,
        };
      }).filter(r => !isNaN(r.LATITUD) && !isNaN(r.LONGITUD));
    }

    function computeKpis(data) {
      if (!data.length) return { total: 0, enAlerta: 0, enAlertaSequia: 0, promedio: '0.00', maximo: 0, maxMpio: '' };
      const total          = data.length;
      const enAlerta       = data.filter(d => d.alerta > 0).length;
      const enAlertaSequia = data.filter(d => d.sequia_categoria === 'SEVERA').length;
      const sum            = data.reduce((acc, d) => acc + d.precip_acum_mm, 0);
      const promedio       = (sum / total).toFixed(2);
      const maxRow         = data.reduce((a, b) => b.precip_acum_mm > a.precip_acum_mm ? b : a);
      return { total, enAlerta, enAlertaSequia, promedio, maximo: maxRow.precip_acum_mm, maxMpio: maxRow.NOM_MPIO };
    }

    // ─── CSV Download Helper ──────────────────────────────────────────────────

    function downloadCSV(data, filename) {
      if (!data.length) return;
      const headers = ['COD_MPIO','NOM_MPIO','NOM_DPTO','precip_acum_mm','precip_max_10min',
                       'alerta_compuesta','frecuencia_extremos','frecuencia_reciente',
                       'ratio_reciente','tendencia','sequia_categoria','n_estaciones','fecha'];
      const rows = data.map(r =>
        headers.map(h => {
          const v = r[h] ?? '';
          return typeof v === 'string' && v.includes(',') ? `"${v}"` : v;
        }).join(',')
      );
      const csv  = '\uFEFF' + [headers.join(','), ...rows].join('\r\n');
      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const url  = URL.createObjectURL(blob);
      const a    = document.createElement('a');
      a.href = url; a.download = filename; a.click();
      URL.revokeObjectURL(url);
    }

    // ─── Cartera Report Helper ────────────────────────────────────────────────

        </tr>`).join('');

      const html = `<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8">
<title>Reporte Cartera \u2013 Alerta Lluvias ALTA</title>
<style>

  .kpi{background:#eaf0fb;padding:14px 20px;border-radius:8px;border-left:4px solid #1a5276;min-width:200px}
  .kpi.red{border-color:#e03131}
  .kpi-val{font-size:1.6em;font-weight:700;color:#1a5276}

</style></head><body>
<h1>Reporte: Cartera en Municipios con Alerta de Lluvias ALTA</h1>

    function exportReportePDFSection(result, mergedRows, dataFecha, config) {

      const html = `<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8">

    const ALERTA_BADGE = {

      'ALTA':         '<span style="color:#e03131;font-weight:600;">\u26a0 ALTA</span>',
      'MODERADA':     '<span style="color:#e67e22;font-weight:600;">\u26a0 MODERADA</span>',

    const TENDENCIA_LABEL = {
      'creciente':    '\u2197 Creciente',

    function buildPopup(m) {
      const badge     = ALERTA_BADGE[m.alerta_compuesta] ?? ALERTA_BADGE['BAJA'];

        ? `<p style="color:#e03131;font-weight:600;margin-top:3px;">\u26a0 Probable evento extremo reciente</p>`
        : (m.precip_acum_mm === 0 && m.sequia_categoria !== 'NORMAL')
        ? `<p style="color:#e67e22;font-weight:600;margin-top:3px;">\u2600\ufe0f Sin lluvia \u2014 posible sequ\u00eda activa</p>`

    // ─── Deslizamientos Map Panel ─────────────────────────────────────────────

    function DeslizMapPanel({ amenazasData, visible = true }) {
      const mapDiv      = useRef(null);
      const leafletMap  = useRef(null);
      const layerGroup  = useRef(null);
      const initialized = useRef(false);

      useEffect(() => {
        if (initialized.current) return;
        initialized.current = true;
        const map = L.map(mapDiv.current, { center: [4.5, -74.0], zoom: 5 });
        L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
          attribution: '&copy; OpenStreetMap contributors &copy; CARTO', maxZoom: 19,
        }).addTo(map);
        map.fitBounds([[1, -79], [13, -67]]);
        layerGroup.current = L.layerGroup().addTo(map);
        leafletMap.current = map;
      }, []);

      useEffect(() => {
        if (visible && leafletMap.current) {
          setTimeout(() => {
            leafletMap.current.invalidateSize();
            leafletMap.current.fitBounds([[1, -79], [13, -67]]);
          }, 60);
        }
      }, [visible]);

      useEffect(() => {
        if (!layerGroup.current) return;
        layerGroup.current.clearLayers();
        const entries = Object.values(amenazasData).filter(d => !isNaN(d.lat) && !isNaN(d.lon));

        entries.forEach(d => {
          const color     = AMENAZA_MM_COLORS[d.amenaza_mm] ?? '#adb5bd';
          const hasAlerta = d.alerta_deslizamiento === 'ALTA';
          const radius    = hasAlerta ? 9 : 6;
          const weight    = hasAlerta ? 2.5 : 0.8;
          const fillOpac  = hasAlerta ? 0.92 : 0.65;
          const borderCol = hasAlerta ? '#7b0000' : 'rgba(255,255,255,0.3)';

          const marker = L.circleMarker([d.lat, d.lon], {
            radius, color: borderCol, weight, fillColor: color, fillOpacity: fillOpac,
          });

          if (hasAlerta) {
            const iconHtml = `<div class="alert-pulse" style="width:22px;height:22px;margin-top:-11px;margin-left:-11px;border-color:#d91919;"></div>`;
            L.marker([d.lat, d.lon], { icon: L.divIcon({ html: iconHtml, className: '', iconSize: [0,0] }) }).addTo(layerGroup.current);
          }

          const acum3  = d.acum_3dias_mm  != null ? `${d.acum_3dias_mm.toFixed(1)} mm` : 'N/D';
          const acum10 = d.acum_10dias_mm != null ? `${d.acum_10dias_mm.toFixed(1)} mm` : 'N/D';
          const dias   = d.dias_lluvia    != null ? d.dias_lluvia : 'N/D';
          const amenazaLabel = { 'MUY_BAJA':'Muy baja','BAJA':'Baja','MEDIA':'Media','ALTA':'Alta','MUY_ALTA':'Muy alta' }[d.amenaza_mm] ?? d.amenaza_mm;
          const alertaBadge  = hasAlerta
            ? `<span style="color:#d91919;font-weight:700;">\u26a0 ALTA \u2014 Alerta IDEAM</span>`
            : `<span style="color:#4fa89b;">\u2713 Sin alerta activa</span>`;
          const fechaLine = d.fecha_ideam
            ? `<p style="color:#8a9ab0;font-size:11px;margin-top:4px;">Alerta al: <b>${d.fecha_ideam}</b></p>` : '';
          const acumSection = hasAlerta ? `
            <hr style="margin:6px 0;border-color:rgba(200,169,110,0.15);">
            <p style="font-size:12px;font-weight:600;color:#e67e22;margin-bottom:2px;">\uD83C\uDF27 Precipitaci\u00f3n acumulada</p>
            <p><b>\u00daltimos 3 d\u00edas:</b> ${acum3}</p>
            <p><b>\u00daltimos 10 d\u00edas:</b> ${acum10}</p>
            <p><b>D\u00edas con lluvia:</b> ${dias}</p>` : '';

          const popup = `
            <div style="font-family:'Lora',Georgia,serif;font-size:13px;min-width:210px;color:#f5f0e8;">
              <div style="color:#c8a96e;font-size:14px;font-weight:700;margin-bottom:2px;">${d.nom_mpio}</div>
              <div style="color:#8a9ab0;font-size:12px;margin-bottom:6px;">${d.nom_dpto}</div>
              <hr style="margin:4px 0;border-color:rgba(200,169,110,0.15);">
              <p style="font-size:12px;font-weight:600;color:#e67e22;margin-bottom:2px;">\u26f0 Amenaza MM \u2014 SGC 1:500k</p>
              <p><b>Nivel est\u00e1tico:</b> <span style="color:${color};font-weight:600;">${amenazaLabel}</span></p>
              <hr style="margin:6px 0;border-color:rgba(200,169,110,0.15);">
              <p style="font-size:12px;font-weight:600;color:#8a9ab0;margin-bottom:2px;">\uD83D\uDCE1 Alerta diaria IDEAM</p>
              <p>${alertaBadge}</p>
              ${acumSection}
              ${fechaLine}
            </div>`;

          marker.bindPopup(popup, { maxWidth: 240 });
          marker.addTo(layerGroup.current);
        });
      }, [amenazasData]);

      return (
        <div className="map-panel-wrap">
          <div ref={mapDiv} className="map-div" />
          <Legend mode="deslizamientos" />
        </div>
      );
    }

    // ─── Map Panel ────────────────────────────────────────────────────────────

    function MapPanel({ data, mode = 'lluvias', visible = true }) {
      const mapDiv      = useRef(null);
      const leafletMap  = useRef(null);
      const layerGroup  = useRef(null);
      const initialized = useRef(false);

      useEffect(() => {
        if (initialized.current) return;
        initialized.current = true;
        const map = L.map(mapDiv.current, { center: [4.5, -74.0], zoom: 5 });
        L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
          attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/">CARTO</a>',
          maxZoom: 19,
        }).addTo(map);
        map.fitBounds([[1, -79], [13, -67]]);
        layerGroup.current = L.layerGroup().addTo(map);
        leafletMap.current = map;
      }, []);

      useEffect(() => {
        if (visible && leafletMap.current) {
          setTimeout(() => {
            leafletMap.current.invalidateSize();
            leafletMap.current.fitBounds([[1, -79], [13, -67]]);
          }, 60);
        }
      }, [visible]);

      useEffect(() => {
        if (!layerGroup.current) return;
        layerGroup.current.clearLayers();

        if (mode === 'sequias') {
          data.forEach(m => {
            const cat    = m.sequia_categoria ?? 'NORMAL';
            const color  = SEQUIA_COLORS[cat] ?? '#adb5bd';
            const radius = 6;

            if (cat === 'SEVERA') {
              const r2   = radius + 5;
              const size = r2 * 2;
              const pulseIcon = L.divIcon({
                className: '',
                html: `<div class="sequia-alert-pulse" style="width:${size}px;height:${size}px;margin-left:-${r2}px;margin-top:-${r2}px;"></div>`,
                iconSize: [0, 0], iconAnchor: [0, 0],
              });
              L.marker([m.LATITUD, m.LONGITUD], { icon: pulseIcon, interactive: false, zIndexOffset: -100 })
                .addTo(layerGroup.current);
            }

            L.circleMarker([m.LATITUD, m.LONGITUD], {
              radius,
              fillColor:   color,
              color:       cat === 'SEVERA' ? '#f0b429' : 'rgba(255,255,255,0.25)',
              weight:      cat === 'SEVERA' ? 2.0 : 0.8,
              opacity:     1,
              fillOpacity: 0.85,
            })
            .bindPopup(buildPopup(m), { maxWidth: 240 })
            .addTo(layerGroup.current);
          });
          return;
        }

        // mode === 'lluvias'
        data.forEach(m => {
          const color  = CATEGORIA_COLORS[m.categoria] ?? '#adb5bd';
          const radius = Math.max(5, Math.min(m.tamano, 22));

          if (m.alerta >= 2) {
            const size = radius * 2;
            const pulseIcon = L.divIcon({
              className: '',
              html: `<div class="alert-pulse" style="width:${size}px;height:${size}px;margin-left:-${radius}px;margin-top:-${radius}px;"></div>`,
              iconSize: [0, 0], iconAnchor: [0, 0],
            });
            L.marker([m.LATITUD, m.LONGITUD], { icon: pulseIcon, interactive: false, zIndexOffset: -100 })
              .addTo(layerGroup.current);
          }

          const borderColor  = m.alerta >= 2 ? '#e03131' : m.alerta === 1 ? '#f0b429' : 'rgba(255,255,255,0.25)';
          const borderWeight = m.alerta >= 1 ? 2.0 : 0.8;

          L.circleMarker([m.LATITUD, m.LONGITUD], {
            radius,
            fillColor:   color,
            color:       borderColor,
            weight:      borderWeight,
            opacity:     1,
            fillOpacity: 0.82,
          })
          .bindPopup(buildPopup(m), { maxWidth: 240 })
          .addTo(layerGroup.current);
        });
      }, [data, mode]);

      return (
        <div className="map-panel-wrap">
          <div ref={mapDiv} className="map-div" />
          <Legend mode={mode} />
        </div>
      );
    }

    // ─── Cartera Box Section (per-indicator) ─────────────────────────────────

    function CarteraBoxSection({ indicador, alertaLookup, alertTargets, alertLabel, dataFecha }) {
      const [carteraData,   setCarteraData]   = useState(null);
      const [carteraResult, setCarteraResult] = useState(null);
      const [carteraError,  setCarteraError]  = useState(null);
      const fileRef = useRef(null);

      const CONFIGS = {
        lluvias:        { title: 'Reporte Cartera \u2013 Alerta Lluvias',        indicadorLabel: 'Precipitaci\u00f3n / Lluvias',    alertColor: '#e03131', csv: 'cartera_lluvias.csv'        },
        sequias:        { title: 'Reporte Cartera \u2013 Sequ\u00eda Severa',    indicadorLabel: 'Sequ\u00eda recurrente (SPI)',    alertColor: '#e8590c', csv: 'cartera_sequias.csv'        },
        deslizamientos: { title: 'Reporte Cartera \u2013 Deslizamientos ALTA',   indicadorLabel: 'Movimientos en masa (SGC)',       alertColor: '#2d6b3c', csv: 'cartera_deslizamientos.csv' },
      };
      const cfg = CONFIGS[indicador] ?? CONFIGS.lluvias;

      function handleFile(e) {
        const file = e.target.files[0];
        if (!file) return;
        setCarteraError(null); setCarteraData(null); setCarteraResult(null);
        Papa.parse(file, {
          header: true, skipEmptyLines: true,
          complete: ({ data, errors }) => {
            if (errors.length) console.warn('Cartera warnings:', errors);
            if (!data.length) { setCarteraError('El archivo est\u00e1 vac\u00edo.'); return; }
            const keys      = Object.keys(data[0]);
            const codCol    = keys.find(k => /cod/i.test(k) && /mpio|muni/i.test(k)) ?? keys.find(k => /cod/i.test(k)) ?? keys[0];
            const carteraCol = keys.find(k => /cartera/i.test(k));
            const nameCol    = keys.find(k => /nom/i.test(k) && /mpio|muni/i.test(k)) ?? keys.find(k => /nombre|name/i.test(k));
            if (!carteraCol) { setCarteraError('No se encontr\u00f3 columna "cartera_total". Verifique el formato.'); return; }
            let totalCartera = 0, cartaRiesgo = 0, nTotal = 0, nRiesgo = 0;
            const merged = [];
            data.forEach(r => {
              const cod    = (r[codCol] ?? '').toString().trim();
              const val    = parseFloat((r[carteraCol] ?? '').toString().replace(/[^0-9.-]/g,'')) || 0;
              const nombre = nameCol ? (r[nameCol] ?? cod) : cod;
              const alerta = alertaLookup[cod] ?? alertaLookup[cod.padStart(5,'0')] ?? 'Sin datos';
              const enRiesgo = alertTargets.includes(alerta);
              totalCartera += val; nTotal++;
              if (enRiesgo) { cartaRiesgo += val; nRiesgo++; }
              merged.push({ cod, nombre, cartera_total: val, alerta_indicador: alerta, enRiesgo });
            });
            const indicator = totalCartera > 0 ? (cartaRiesgo / totalCartera * 100).toFixed(2) : '0.00';
            setCarteraData(merged);
            setCarteraResult({ totalCartera, cartaRiesgo, indicator, nTotal, nRiesgo });
          },
          error: err => setCarteraError('Error al leer el archivo: ' + err.message),
        });
        e.target.value = '';
      }

      function handleExportCSV() {
        if (!carteraData) return;
        const headers = ['cod','nombre','cartera_total','alerta_indicador'];
        const rows = carteraData.map(r => [r.cod, `"${r.nombre}"`, r.cartera_total, r.alerta_indicador].join(','));
        const csv  = '\uFEFF' + [headers.join(','), ...rows].join('\r\n');
        const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
        const url  = URL.createObjectURL(blob);
        const a    = document.createElement('a');
        a.href = url; a.download = cfg.csv; a.click();
        URL.revokeObjectURL(url);
      }

      const fmtM = v => (v / 1e6).toFixed(1) + ' M';
      const capFirst = s => s.charAt(0).toUpperCase() + s.slice(1);

      return (
        <div className="panel-card">
          <div className="panel-card-title">An&aacute;lisis de Cartera &middot; {capFirst(indicador)}</div>
          <div className="btn-row">
            <button onClick={() => { const a=document.createElement('a'); a.href='data/cartera_municipios_codigos.csv'; a.download='cartera_municipios_codigos.csv'; a.click(); }} className="btn btn-dark">
              &#x1F4CB; Ejemplo
            </button>
            <button onClick={() => fileRef.current?.click()} className="btn btn-primary">
              &#x1F4C2; Cargar cartera
            </button>

    function ChartBox({ allData }) {
      const canvasRef = useRef(null);
      const chartRef  = useRef(null);

      useEffect(() => {
        if (!canvasRef.current) return;

        const deptMap = {};
        allData.forEach(d => {
          if (!deptMap[d.NOM_DPTO]) deptMap[d.NOM_DPTO] = { sum: 0, count: 0 };
          deptMap[d.NOM_DPTO].sum   += d.precip_acum_mm;
          deptMap[d.NOM_DPTO].count += 1;
        });
        const sorted = Object.entries(deptMap)
          .map(([name, v]) => ({ name, avg: v.sum / v.count }))
          .sort((a, b) => b.avg - a.avg)
          .slice(0, 10);

        const labels = sorted.map(d => d.name.length > 16 ? d.name.slice(0, 16) + '\u2026' : d.name);
        const values = sorted.map(d => parseFloat(d.avg.toFixed(2)));

        if (chartRef.current) {
          chartRef.current.data.labels           = labels;
          chartRef.current.data.datasets[0].data = values;
          chartRef.current.update();
        } else {
          chartRef.current = new Chart(canvasRef.current, {
            type: 'bar',
            data: {
              labels,
              datasets: [{
                label: 'Precip. promedio (mm)',
                data: values,
                backgroundColor: 'rgba(79,168,155,0.55)',
                borderColor: 'rgba(200,169,110,0.5)',
                borderWidth: 1,
                borderRadius: 2,
              }]
            },
            options: {
              indexAxis: 'y',
              responsive: true,
              maintainAspectRatio: false,

                legend: { display: false },

    // ─── Cartera Analysis Box ─────────────────────────────────────────────────

    function CarteraBox({ alertaHistData, allData, dataFecha }) {
      const [carteraData,   setCarteraData]   = useState(null);
      const [carteraResult, setCarteraResult] = useState(null);
      const [carteraError,  setCarteraError]  = useState(null);
      const fileRef = useRef(null);

      function downloadSample() {
        const a = document.createElement('a');
        a.href = 'data/cartera_municipios_codigos.csv';
        a.download = 'cartera_municipios_codigos.csv';
        a.click();
      }

      function handleFile(e) {
        const file = e.target.files[0];
        if (!file) return;
        setCarteraError(null); setCarteraData(null); setCarteraResult(null);

        Papa.parse(file, {
          header: true,
          skipEmptyLines: true,
          complete: ({ data, errors }) => {
            if (errors.length) console.warn('Cartera CSV warnings:', errors);
            if (!data.length) { setCarteraError('El archivo est\u00e1 vac\u00edo.'); return; }

            const firstRow = data[0];
            const keys     = Object.keys(firstRow);
            const codCol    = keys.find(k => /cod/i.test(k) && /mpio|muni/i.test(k)) ?? keys.find(k => /cod/i.test(k)) ?? keys[0];
            const carteraCol = keys.find(k => /cartera/i.test(k));
            const nameCol    = keys.find(k => /nom/i.test(k) && /mpio|muni/i.test(k)) ?? keys.find(k => /nombre|name/i.test(k));

            if (!carteraCol) {
              setCarteraError('No se encontr\u00f3 columna "cartera_total" en el archivo. Verifique el formato.');
              return;
            }

            let totalCartera = 0, cartaAlta = 0, nTotal = 0, nAlta = 0;
            const merged = [];

            data.forEach(r => {
              const cod    = (r[codCol] ?? '').toString().trim();
              const val    = parseFloat((r[carteraCol] ?? '').toString().replace(/[^0-9.-]/g,'')) || 0;
              const nombre = nameCol ? (r[nameCol] ?? cod) : cod;
              const alerta = alertaHistData[cod] ?? alertaHistData[cod.padStart(5,'0')] ?? 'Sin datos';
              totalCartera += val; nTotal++;
              if (alerta === 'ALTA') { cartaAlta += val; nAlta++; }
              merged.push({ cod, nombre, cartera_total: val, alerta_lluvias: alerta, _col: carteraCol });
            });

            const indicator = totalCartera > 0 ? (cartaAlta / totalCartera * 100).toFixed(2) : '0.00';
            setCarteraData(merged);
            setCarteraResult({ totalCartera, cartaAlta, indicator, nTotal, nAlta, carteraCol });
          },
          error: err => setCarteraError('Error al leer el archivo: ' + err.message),
        });
        e.target.value = '';
      }

      function handleExportCSV() {
        if (!carteraData) return;
        const headers = ['cod','nombre','cartera_total','alerta_lluvias'];
        const rows    = carteraData.map(r =>
          [r.cod, `"${r.nombre}"`, r.cartera_total, r.alerta_lluvias].join(',')
        );
        const csv  = '\uFEFF' + [headers.join(','), ...rows].join('\r\n');
        const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
        const url  = URL.createObjectURL(blob);
        const a    = document.createElement('a');
        a.href = url; a.download = 'cartera_alerta_lluvias.csv'; a.click();
        URL.revokeObjectURL(url);
      }

      const fmtM = v => (v / 1e6).toFixed(1) + ' M';

      return (
        <div className="panel-card">
          <div className="panel-card-title">An&aacute;lisis de Cartera</div>

          <div className="btn-row">
            <button onClick={downloadSample} className="btn btn-dark">
              &#x1F4CB; Archivo de ejemplo
            </button>
            <button onClick={() => fileRef.current?.click()} className="btn btn-primary">
              &#x1F4C2; Cargar cartera
            </button>
            <input ref={fileRef} type="file" accept=".csv,.xlsx,.xls" onChange={handleFile} style={{display:'none'}} />
          </div>

          <p className="hint-text">
            Cargue un CSV con columnas <code>COD_MPIO</code> y <code>cartera_total</code>.
            Se cruza con la alerta hist&oacute;rica de lluvias.
          </p>

          {carteraError && (
            <div className="error-box">&#x26A0; {carteraError}</div>
          )}

          {carteraResult && (
            <div>
              <div className="indicator-box">
                <div className="indicator-value">{carteraResult.indicator}%</div>
                <div className="indicator-label">Cartera en alerta ALTA / Cartera total</div>
              </div>

              <div className="cartera-kpi-grid">
                <div className="cartera-kpi danger">
                  <div className="cartera-kpi-value">{fmtM(carteraResult.cartaAlta)} COP</div>
                  <div className="cartera-kpi-label">
                    Cartera en alerta ALTA
                    <span style={{marginLeft:'4px', color:'var(--danger)'}}>({carteraResult.nAlta} mpios)</span>
                  </div>
                </div>
                <div className="cartera-kpi">
                  <div className="cartera-kpi-value">{fmtM(carteraResult.totalCartera)} COP</div>
                  <div className="cartera-kpi-label">
                    Cartera total
                    <span style={{marginLeft:'4px', color:'var(--accent-gold)'}}>({carteraResult.nTotal} mpios)</span>
                  </div>
                </div>
              </div>

              <div style={{display:'flex', gap:'8px'}}>
                <button
                  onClick={() => exportReportePDF(carteraResult, carteraData, dataFecha)}
                  className="btn btn-danger"
                  style={{flex:1, justifyContent:'center'}}
                >
                  &#x1F4C4; Exportar PDF

                <button

                  className="btn btn-success"
                  style={{flex:1, justifyContent:'center'}}
                >
                  &#x1F4BE; Exportar CSV
                </button>
              </div>
            </div>
          )}
        </div>
      );
    }

    // ─── Áreas Protegidas Section ─────────────────────────────────────────────

    function AreasProtegidasSection({ visible, onBack, apData }) {
      const [activeTab,      setActiveTab]      = React.useState('Municipios');
      const [deptFilter,     setDeptFilter]     = React.useState('ALL');
      const [protegidoOnly,  setProtegidoOnly]  = React.useState(false);
      const [checkLat,       setCheckLat]       = React.useState('');
      const [checkLon,       setCheckLon]       = React.useState('');
      const [checkResult,    setCheckResult]    = React.useState(null);
      const [checkLoading,   setCheckLoading]   = React.useState(false);
      const [geojsonData,    setGeojsonData]    = React.useState(null);
      const [geojsonError,   setGeojsonError]   = React.useState(null);
      const TABS = ['Municipios', 'Verificar proyecto'];

      const departments = useMemo(() => {
        const set = new Set(apData.map(d => d.NOM_DPTO));
        return ['ALL', ...Array.from(set).sort()];
      }, [apData]);

      const filtered = useMemo(() =>
        apData
          .filter(d => deptFilter === 'ALL' || d.NOM_DPTO === deptFilter)
          .filter(d => !protegidoOnly || parseInt(d.tiene_area_protegida) === 1),
        [apData, deptFilter, protegidoOnly]
      );

      const totalProtegidos = useMemo(
        () => apData.filter(d => parseInt(d.tiene_area_protegida) === 1).length,
        [apData]
      );

      // Load simplified GeoJSON when section becomes visible
      React.useEffect(() => {
        if (!visible || geojsonData || geojsonError) return;
        fetch('data/areas_protegidas_simple.geojson')
          .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
          .then(gj => setGeojsonData(gj))
          .catch(err => setGeojsonError('No se pudo cargar el GeoJSON: ' + err.message));
      }, [visible]);

      // Ray-casting point-in-polygon
      function pip(pt, ring) {
        const [x, y] = pt; let inside = false;
        for (let i = 0, j = ring.length - 1; i < ring.length; j = i++) {
          const [xi, yi] = ring[i], [xj, yj] = ring[j];
          if (((yi > y) !== (yj > y)) && x < (xj - xi) * (y - yi) / (yj - yi) + xi) inside = !inside;
        }
        return inside;
      }

      function checkCoordinates() {
        const lat = parseFloat(checkLat), lon = parseFloat(checkLon);
        if (isNaN(lat) || isNaN(lon)) return;
        if (!geojsonData) { setCheckResult({ error: 'Datos geogr\u00e1ficos aún no cargados. Espere un momento.' }); return; }
        setCheckLoading(true);
        const pt = [lon, lat];
        const matches = [];
        for (const feat of geojsonData.features) {
          const g = feat.geometry; if (!g) continue;
          let hit = false;
          if (g.type === 'Polygon') {
            hit = pip(pt, g.coordinates[0]);
          } else if (g.type === 'MultiPolygon') {
            for (const poly of g.coordinates) { if (pip(pt, poly[0])) { hit = true; break; } }
          }
          if (hit) matches.push(feat.properties);
        }
        setCheckResult({ lat, lon, matches });
        setCheckLoading(false);
      }

      function downloadApCSV() {
        const rows = apData.filter(d => parseInt(d.tiene_area_protegida) === 1);
        const headers = ['COD_MPIO','NOM_MPIO','NOM_DPTO','LATITUD','LONGITUD','n_areas','areas_nombres','area_categoria','area_ambito','area_ha_total'];
        const lines = rows.map(r =>
          headers.map(h => h === 'areas_nombres' || h === 'area_categoria' || h === 'area_ambito' ? `"${r[h] ?? ''}"` : r[h] ?? '').join(',')
        );
        const csv  = '\uFEFF' + [headers.join(','), ...lines].join('\r\n');
        const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
        const url  = URL.createObjectURL(blob);
        const a    = document.createElement('a'); a.href = url; a.download = 'areas_protegidas_municipal.csv'; a.click();
        URL.revokeObjectURL(url);
      }

      return (
        <div className={`ov-content-section${visible ? ' ov-visible' : ''}`}>
          <div className="ov-section-header">
            <div className="ov-breadcrumb">
              <button onClick={onBack}>Resumen general</button>
              {'\u00a0/\u00a0\u00c1reas Protegidas'}
            </div>
            <div className="ov-section-title-row">
              <div className="ov-section-title">&Aacute;reas Protegidas &middot; SINAP&ndash;RUNAP</div>
              <span className="ov-alert-badge" style={{background:'#1b5e20'}}>{totalProtegidos} municipios</span>
            </div>
          </div>
          <OvSubTabs tabs={TABS} active={activeTab} accentColor="#2e7d32" onSelect={setActiveTab} />

          {/* ── Tab: Municipios ── */}
          {activeTab === 'Municipios' && (
            <div style={{background:'var(--bg-primary)'}}>
              <div className="dashboard-main">
                <div className="kpi-grid reveal">
                  <KpiCard label="Municipios analizados"  value={apData.length}                                             icon="&#x1F3D9;" />
                  <KpiCard label="Con \u00e1rea protegida" value={totalProtegidos}                                           icon="&#x1F333;" accent="green" />
                  <KpiCard label="% de cartera afectada"  value={`${((totalProtegidos/apData.length)*100).toFixed(1)}%`}   icon="&#x1F4CA;" accent="gold" />
                  <KpiCard label="Filtrados protegidos"   value={filtered.filter(d=>parseInt(d.tiene_area_protegida)===1).length} icon="&#x1F50D;" />
                </div>
                <div className="map-layout">
                  <div className="map-main">
                    <AreasProtegidasMapPanel apData={filtered} visible={visible && activeTab === 'Municipios'} />
                  </div>
                  <div className="map-side side-panel">
                    <div className="side-card">
                      <div className="side-card-title">Filtros</div>
                      <div style={{marginBottom:'10px'}}>
                        <label style={{fontSize:'12px',color:'var(--text-muted)',display:'block',marginBottom:'4px'}}>Departamento</label>
                        <select value={deptFilter} onChange={e => setDeptFilter(e.target.value)}
                          style={{width:'100%',padding:'6px 8px',background:'var(--bg-card)',border:'1px solid var(--border)',borderRadius:'4px',color:'var(--text-primary)',fontSize:'12px'}}>
                          {departments.map(d => <option key={d} value={d}>{d === 'ALL' ? 'Todos los departamentos' : d}</option>)}
                        </select>
                      </div>
                      <label style={{display:'flex',alignItems:'center',gap:'8px',cursor:'pointer',fontSize:'13px'}}>
                        <input type="checkbox" checked={protegidoOnly} onChange={() => setProtegidoOnly(v => !v)} />
                        Solo municipios con &aacute;rea protegida
                      </label>
                      <button onClick={downloadApCSV}
                        style={{marginTop:'12px',width:'100%',padding:'7px',background:'rgba(200,169,110,0.08)',border:'1px solid var(--border)',borderRadius:'4px',color:'var(--accent-gold)',fontSize:'12px',cursor:'pointer',fontFamily:"'DM Mono',monospace",letterSpacing:'0.06em'}}>
                        &#x2B07; Exportar CSV
                      </button>
                    </div>
                    <div className="side-card" style={{marginTop:'12px',fontSize:'12px',color:'var(--text-muted)'}}>
                      <div className="side-card-title">Fuente</div>
                      <p>Sistema Nacional de &Aacute;reas Protegidas (SINAP) &mdash; RUNAP</p>
                      <p style={{marginTop:'4px'}}>Ministerio de Ambiente y Desarrollo Sostenible (MADS)</p>
                      <p style={{marginTop:'4px'}}>Servicio ArcGIS REST &mdash; OTL_Area_Protegida &middot; 1,773 pol&iacute;gonos</p>
                    </div>
                    <AreasProtegidasTable data={filtered} />
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* ── Tab: Verificar proyecto ── */}
          {activeTab === 'Verificar proyecto' && (
            <div style={{background:'var(--bg-primary)',padding:'32px 24px'}}>
              <div style={{maxWidth:'680px',margin:'0 auto'}}>
                <div style={{fontFamily:"'Cormorant Garamond',serif",fontSize:'22px',fontWeight:600,color:'var(--accent-gold)',marginBottom:'6px'}}>
                  Verificar coordenadas de proyecto
                </div>
                <div style={{fontSize:'13px',color:'var(--text-muted)',marginBottom:'24px',lineHeight:'1.6'}}>
                  Ingrese las coordenadas geogr&aacute;ficas del proyecto para determinar si se encuentra dentro de
                  un &aacute;rea protegida del SINAP&ndash;RUNAP de Colombia.
                  {!geojsonData && !geojsonError && <span style={{color:'#e67e22',marginLeft:'8px'}}>&#x23F3; Cargando datos geogr&aacute;ficos&hellip;</span>}
                  {geojsonError && <span style={{color:'var(--danger)',marginLeft:'8px'}}>&#x26A0; {geojsonError}</span>}
                </div>

                <div style={{display:'flex',gap:'16px',marginBottom:'16px',flexWrap:'wrap'}}>
                  <div style={{flex:1,minWidth:'180px'}}>
                    <label style={{fontSize:'11px',fontFamily:"'DM Mono',monospace",letterSpacing:'0.1em',color:'var(--text-muted)',textTransform:'uppercase',display:'block',marginBottom:'6px'}}>Latitud (decimal)</label>
                    <input
                      type="number" step="any" placeholder="ej: 4.7109"
                      value={checkLat} onChange={e => { setCheckLat(e.target.value); setCheckResult(null); }}
                      style={{width:'100%',padding:'10px 12px',background:'var(--bg-card)',border:'1px solid var(--border-strong)',borderRadius:'4px',color:'var(--text-primary)',fontSize:'14px',fontFamily:"'DM Mono',monospace"}}
                    />
                  </div>
                  <div style={{flex:1,minWidth:'180px'}}>
                    <label style={{fontSize:'11px',fontFamily:"'DM Mono',monospace",letterSpacing:'0.1em',color:'var(--text-muted)',textTransform:'uppercase',display:'block',marginBottom:'6px'}}>Longitud (decimal)</label>
                    <input
                      type="number" step="any" placeholder="ej: -74.0721"
                      value={checkLon} onChange={e => { setCheckLon(e.target.value); setCheckResult(null); }}
                      style={{width:'100%',padding:'10px 12px',background:'var(--bg-card)',border:'1px solid var(--border-strong)',borderRadius:'4px',color:'var(--text-primary)',fontSize:'14px',fontFamily:"'DM Mono',monospace"}}
                    />
                  </div>
                </div>

                <button
                  onClick={checkCoordinates}
                  disabled={checkLoading || !checkLat || !checkLon}
                  style={{padding:'11px 28px',background:'rgba(46,125,50,0.15)',border:'1px solid rgba(46,125,50,0.5)',borderRadius:'4px',color:'#81c784',fontSize:'13px',fontFamily:"'DM Mono',monospace",letterSpacing:'0.08em',cursor:'pointer',opacity:(!checkLat||!checkLon)?0.4:1,transition:'all 0.2s'}}>
                  {checkLoading ? '&#x23F3; Verificando...' : '&#x1F50D; Verificar ubicaci\u00f3n'}
                </button>

                {checkResult && !checkResult.error && (
                  <div style={{marginTop:'28px',padding:'20px 24px',background:'var(--bg-card)',border:'1px solid var(--border)',borderRadius:'6px'}}>
                    <div style={{fontFamily:"'DM Mono',monospace",fontSize:'10px',letterSpacing:'0.15em',color:'var(--text-muted)',textTransform:'uppercase',marginBottom:'12px'}}>
                      Resultado &mdash; ({checkResult.lat.toFixed(6)}, {checkResult.lon.toFixed(6)})
                    </div>
                    {checkResult.matches.length === 0 ? (
                      <div style={{display:'flex',alignItems:'center',gap:'12px'}}>
                        <span style={{fontSize:'32px'}}>&#x2705;</span>
                        <div>
                          <div style={{fontSize:'18px',fontWeight:600,color:'#81c784',fontFamily:"'Cormorant Garamond',serif"}}>Fuera de &aacute;rea protegida</div>
                          <div style={{fontSize:'13px',color:'var(--text-muted)',marginTop:'4px'}}>Las coordenadas no se encuentran dentro de ninguna &aacute;rea del SINAP&ndash;RUNAP.</div>
                        </div>
                      </div>
                    ) : (
                      <div>
                        <div style={{display:'flex',alignItems:'center',gap:'12px',marginBottom:'16px'}}>
                          <span style={{fontSize:'32px'}}>&#x26A0;&#xFE0F;</span>
                          <div>
                            <div style={{fontSize:'18px',fontWeight:600,color:'#e57373',fontFamily:"'Cormorant Garamond',serif"}}>Dentro de &aacute;rea protegida</div>
                            <div style={{fontSize:'13px',color:'var(--text-muted)',marginTop:'4px'}}>
                              Las coordenadas se encuentran en {checkResult.matches.length} &aacute;rea{checkResult.matches.length > 1 ? 's' : ''} protegida{checkResult.matches.length > 1 ? 's' : ''} del SINAP&ndash;RUNAP.
                            </div>
                          </div>
                        </div>
                        {checkResult.matches.map((m, i) => (
                          <div key={i} style={{padding:'12px 16px',background:'rgba(229,115,115,0.08)',border:'1px solid rgba(229,115,115,0.25)',borderRadius:'4px',marginBottom:'8px'}}>
                            <div style={{fontWeight:600,color:'#ef9a9a',fontSize:'14px',marginBottom:'4px'}}>{m.uab_nombre_area_protegida ?? 'N/D'}</div>
                            <div style={{fontSize:'12px',color:'var(--text-muted)',display:'flex',gap:'18px',flexWrap:'wrap'}}>
                              <span><b>Categor&iacute;a:</b> {m.categoria_nombre ?? 'N/D'}</span>
                              <span><b>&Aacute;mbito:</b> {m.ambito_nombre ?? 'N/D'}</span>
                              {m.area_total_ha && <span><b>&Aacute;rea:</b> {parseFloat(m.area_total_ha).toLocaleString('es-CO',{maximumFractionDigits:0})} ha</span>}
                            </div>
                          </div>
                        ))}
                      </div>
                    )}
                  </div>
                )}

                {checkResult && checkResult.error && (
                  <div style={{marginTop:'16px',padding:'14px 18px',background:'rgba(192,57,43,0.1)',border:'1px solid rgba(192,57,43,0.3)',borderRadius:'4px',color:'var(--danger)',fontSize:'13px'}}>
                    &#x26A0; {checkResult.error}
                  </div>
                )}
              </div>
            </div>
          )}
        </div>
      );
    }

    // ─── Overview Dashboard (orchestrator) ───────────────────────────────────

    function OverviewDashboard({ allData, amenazasData, alertaHistData, apData, dataFecha }) {
      const [activeSection, setActiveSection] = React.useState(null);

      function showSection(name) {
        setActiveSection(name);
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }

      function goBack() {
        setActiveSection(null);
      }

      return (
        <div>
          <OverviewKpiStrip />
          <div style={{display: activeSection ? 'none' : 'block'}}>
            <OverviewSectionCards onSelect={showSection} />
          </div>
          <div className="ov-sections-container">
            <LluviasSection          visible={activeSection === 'lluvias'}          onBack={goBack} data={allData}       alertaHistData={alertaHistData} dataFecha={dataFecha} />
            <SequiasSection          visible={activeSection === 'sequias'}          onBack={goBack} data={allData}       dataFecha={dataFecha} />
            <DeslizSection           visible={activeSection === 'deslizamientos'}   onBack={goBack} amenazasData={amenazasData} dataFecha={dataFecha} />
            <AreasProtegidasSection  visible={activeSection === 'areas_protegidas'} onBack={goBack} apData={apData} />
          </div>
        </div>
      );
    }

    // ─── App ──────────────────────────────────────────────────────────────────

    function App() {
      const [allData,        setAllData]       = useState([]);
      const [alertaHistData, setAlertaHistData] = useState({});
      const [amenazasData,   setAmenazasData]   = useState({});
      const [apData,         setApData]         = useState([]);
      const [deptFilter,     setDeptFilter]     = useState('ALL');
      const [alertOnly,      setAlertOnly]      = useState(false);
      const [loading,        setLoading]        = useState(true);
      const [error,          setError]          = useState(null);
      const [activeMap,      setActiveMap]      = useState('lluvias');

      // Scroll reveal
      useEffect(() => {
        const observer = new IntersectionObserver(
          entries => entries.forEach(e => { if (e.isIntersecting) e.target.classList.add('visible'); }),
          { threshold: 0.08 }
        );
        document.querySelectorAll('.reveal').forEach(el => observer.observe(el));
        return () => observer.disconnect();
      }, [loading]);

      // Load daily precipitation data
      useEffect(() => {
        Papa.parse('data/datos_municipios.csv', {
          download: true, header: true, skipEmptyLines: true, encoding: 'UTF-8',
          complete: ({ data, errors }) => {
            if (errors.length) console.warn('CSV warnings:', errors);
            setAllData(parseRows(data));
            setLoading(false);
          },
          error: err => {
            const isFileProtocol = window.location.protocol === 'file:';
            const hint = isFileProtocol
              ? 'Abre el archivo desde un servidor local (ej: Live Server en VS Code o "python -m http.server").'
              : 'Verifica que datos_municipios.csv exista en la carpeta data/.';
            const msg = (err && typeof err.message === 'string' && !err.message.includes('ProgressEvent'))
              ? err.message : hint;
            setError(msg);
            setLoading(false);
          }
        });
      }, []);

      // Load historical alert data
      useEffect(() => {
        Papa.parse('data/alerta_historica_municipal.csv', {
          download: true, header: true, skipEmptyLines: true, encoding: 'UTF-8',
          complete: ({ data }) => {
            const map = {};
            data.forEach(r => {
              const cod = (r['COD_MPIO'] ?? r['\uFEFFCOD_MPIO'] ?? '').toString().trim();
              if (cod) map[cod] = (r.alerta_lluvias ?? 'BAJA').trim();
            });
            setAlertaHistData(map);
          },
          error: err => console.warn('No se pudo cargar alerta_historica_municipal.csv:', err),
        });
      }, []);

      // Load amenazas municipales
      useEffect(() => {
        Papa.parse('data/amenazas_municipal.csv', {
          download: true, header: true, skipEmptyLines: true, encoding: 'UTF-8',
          complete: ({ data }) => {
            const map = {};
            data.forEach(r => {
              const cod = (r['cod_divipola'] ?? r['\uFEFFcod_divipola'] ?? '').toString().trim();
              if (cod) map[cod] = {
                amenaza_mm:           (r.amenaza_mm           ?? '').trim(),
                amenaza_mm_val:       parseInt(r.amenaza_mm_val) || 0,
                alerta_deslizamiento: (r.alerta_deslizamiento ?? '').trim(),
                acum_3dias_mm:        parseFloat(r.acum_3dias_mm)  || null,
                acum_10dias_mm:       parseFloat(r.acum_10dias_mm) || null,
                dias_lluvia:          parseFloat(r.dias_lluvia)    || null,
                fecha_ideam:          (r.fecha_ideam ?? '').trim(),
                lat:                  parseFloat(r.LATITUD),
                lon:                  parseFloat(r.LONGITUD),
                nom_mpio:             (r.NOM_MPIO ?? '').trim(),
                nom_dpto:             (r.NOM_DPTO ?? '').trim(),
              };
            });
            setAmenazasData(map);
          },
          error: err => console.warn('No se pudo cargar amenazas_municipal.csv:', err),
        });
      }, []);

      // Load áreas protegidas por municipio
      useEffect(() => {
        Papa.parse('data/areas_protegidas_municipal.csv', {
          download: true, header: true, skipEmptyLines: true, encoding: 'UTF-8',
          complete: ({ data }) => setApData(data),
          error: err => console.warn('No se pudo cargar areas_protegidas_municipal.csv:', err),
        });
      }, []);

      const filteredData = useMemo(() => {
        return allData
          .filter(d => deptFilter === 'ALL' || d.NOM_DPTO === deptFilter)
          .filter(d => !alertOnly || d.alerta > 0);
      }, [allData, deptFilter, alertOnly]);

      const kpis = useMemo(() => computeKpis(allData), [allData]);

      const departments = useMemo(() => {
        const set = new Set(allData.map(d => d.NOM_DPTO));
        return ['ALL', ...Array.from(set).sort()];
      }, [allData]);

      const dataFecha = useMemo(() => {
        const row = allData.find(d => d.fecha && d.fecha !== '');
        return row ? row.fecha : null;
      }, [allData]);

      if (loading) return <LoadingScreen />;
      if (error)   return <ErrorScreen message={error} />;

      return (
        <div style={{background:'var(--bg-primary)', minHeight:'100vh'}}>
          <LandingHero />
          <div id="dashboard">
            <Header dataFecha={dataFecha} />
            <OverviewDashboard allData={allData} amenazasData={amenazasData} alertaHistData={alertaHistData} apData={apData} dataFecha={dataFecha} />
            <footer className="site-footer">
              <div>
                <div className="footer-brand">GGGI &mdash; Sustainable Finance</div>
                <div className="footer-sub">Herramienta Circular 0015 &middot; Colombia &middot; 2025</div>
              </div>
              <div className="footer-sources">
                <strong>Fuentes de datos</strong>
                <div>Precipitaci&oacute;n diaria: IDEAM &mdash; datos.gov.co</div>
                <div>Amenaza movimientos en masa: SGC 1:500k (2011)</div>
                <div>Alertas deslizamiento: IDEAM OSPA (diario)</div>
                <div>Inundaciones hist&oacute;ricas: UNGRD &mdash; Ola invernal 2010&ndash;2011</div>
              </div>
            </footer>
          </div>
        </div>
      );
    }

    // ─── Bootstrap ────────────────────────────────────────────────────────────

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
